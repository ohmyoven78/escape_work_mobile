  /** 아늑한 방 + 치즈 고양이 (variant: "left" 원본 / "right" 틀린 그림) — 패널 왼쪽 위가 (0,0) */
  function paintCatRoom(g, variant) {
    const O = 0x3b2a1c, W = CAT.W, H = CAT.H, R = variant === "right";
    const ORANGE = 0xf4a340, ORANGE_D = 0xe08a2b, CREAM = 0xfde7c7, PINK = 0xf7a1b5;

    // 벽 · 벽지 · 걸레받이 · 나무 바닥
    g.fillStyle(0xf6e3c4, 1).fillRect(0, 0, W, 332);
    g.fillStyle(0xecd2a8, 1);
    for (let y = 22; y < 320; y += 38) for (let x = (y / 38) % 2 ? 40 : 20; x < W; x += 40) g.fillCircle(x, y, 3);
    g.fillStyle(0xd29d6a, 1).fillRect(0, 332, W, H - 332);
    g.lineStyle(2, 0xb07a4a, 1).lineBetween(0, 364, W, 364).lineBetween(0, 400, W, 400).lineBetween(0, 438, W, 438);
    [[80, 332, 364], [300, 332, 364], [180, 364, 400], [420, 364, 400], [60, 400, 438], [330, 400, 438], [200, 438, H]]
      .forEach(([x, y1, y2]) => g.lineBetween(x, y1, x, y2));
    g.fillStyle(0xc08a5a, 1).fillRect(0, 322, W, 12);
    g.fillStyle(0xdcae7c, 1).fillRect(0, 322, W, 3);

    // 창문 (하늘 · 해 · 구름 · 창살 · 창틀)
    g.fillStyle(O, 1).fillRoundedRect(30, 30, 150, 128, 10);
    g.fillStyle(0x9a6a3c, 1).fillRoundedRect(34, 34, 142, 120, 8);
    g.fillStyle(0xbfe6f7, 1).fillRect(44, 44, 122, 100);
    g.fillStyle(0xfff1b8, 1).fillCircle(142, 68, 14);
    g.fillStyle(0xffffff, 1).fillCircle(70, 108, 12).fillCircle(86, 102, 15).fillCircle(102, 110, 11).fillRect(62, 108, 48, 12);
    g.fillStyle(0x9a6a3c, 1).fillRect(101, 44, 8, 100).fillRect(44, 90, 122, 8);
    g.fillStyle(O, 1).fillRoundedRect(22, 150, 166, 16, 5);
    g.fillStyle(0xb07a4a, 1).fillRoundedRect(25, 152, 160, 11, 4);

    // 벽 액자 (물고기 그림)
    g.fillStyle(O, 1).fillRoundedRect(376, 46, 98, 78, 6);
    g.fillStyle(0xc08a5a, 1).fillRoundedRect(380, 50, 90, 70, 5);
    g.fillStyle(0xd6f1fb, 1).fillRect(390, 60, 70, 50);
    g.fillStyle(0x60a5fa, 1).fillEllipse(420, 85, 36, 18).fillTriangle(436, 85, 450, 75, 450, 95);
    g.fillStyle(O, 1).fillCircle(410, 82, 2.5);

    // 러그
    g.fillStyle(O, 1).fillEllipse(255, 412, 430, 104);
    g.fillStyle(0xe07a5f, 1).fillEllipse(255, 410, 420, 94);
    g.fillStyle(0xf2cc8f, 1).fillEllipse(255, 410, 360, 70);
    g.fillStyle(0xe07a5f, 1).fillEllipse(255, 410, 300, 50);
    g.fillStyle(0x000000, 0.15).fillEllipse(255, 402, 240, 34);

    // 꼬리 (몸 뒤로 말려 올라감)
    const tail = [{ x: 300, y: 382 }, { x: 352, y: 372 }, { x: 388, y: 338 }, { x: 394, y: 298 }, { x: 376, y: 272 }];
    g.lineStyle(32, O, 1).strokePoints(tail);
    g.fillStyle(O, 1).fillCircle(376, 272, 16);
    g.lineStyle(24, ORANGE, 1).strokePoints(tail);
    g.fillStyle(ORANGE_D, 1).fillCircle(376, 272, 12);

    // 몸통 + 배
    g.fillStyle(O, 1).fillEllipse(250, 320, 208, 188);
    g.fillStyle(ORANGE, 1).fillEllipse(250, 320, 198, 178);
    g.fillStyle(CREAM, 1).fillEllipse(250, 342, 116, 122);
    g.lineStyle(6, ORANGE_D, 1).lineBetween(164, 300, 180, 306).lineBetween(162, 324, 180, 328).lineBetween(336, 300, 320, 306).lineBetween(338, 324, 320, 328);

    // 귀 (머리보다 먼저 → 머리가 귀 아랫부분을 덮음)
    [[[172, 168], [180, 92], [232, 140]], [[328, 168], [320, 92], [268, 140]]].forEach(([a, b, c]) => {
      g.fillStyle(O, 1).fillTriangle(a[0] - 5, a[1] + 3, b[0], b[1] - 7, c[0] + (a[0] < 250 ? 6 : -6), c[1] + 2);
      g.fillStyle(ORANGE, 1).fillTriangle(a[0], a[1], b[0], b[1], c[0], c[1]);
    });
    g.fillStyle(0xf7b2bd, 1).fillTriangle(186, 150, 188, 112, 216, 140).fillTriangle(314, 150, 312, 112, 284, 140);

    // 머리
    g.fillStyle(O, 1).fillEllipse(250, 212, 200, 176);
    g.fillStyle(ORANGE, 1).fillEllipse(250, 212, 190, 166);
    g.fillStyle(0xfbbf6a, 1).fillEllipse(226, 176, 70, 26);
    g.fillStyle(CREAM, 1).fillEllipse(250, 248, 92, 52);
    [[238, 136, 240, 154], [250, 132, 250, 156], [262, 136, 260, 154]].forEach(([x1, y1, x2, y2]) => {
      g.lineStyle(7, ORANGE_D, 1).lineBetween(x1, y1, x2, y2);
      g.fillStyle(ORANGE_D, 1).fillCircle(x1, y1, 3.5).fillCircle(x2, y2, 3.5);
    });

    // ★ Spot 3: 볼터치 (원본에만 있음)
    if (!R) g.fillStyle(PINK, 0.9).fillEllipse(196, 246, 38, 22).fillEllipse(304, 246, 38, 22);

    // 감은 눈 · 코 · 입(ω) · 수염
    g.lineStyle(5, O, 1);
    g.beginPath().arc(218, 206, 14, 0.15 * Math.PI, 0.85 * Math.PI).strokePath();
    g.beginPath().arc(282, 206, 14, 0.15 * Math.PI, 0.85 * Math.PI).strokePath();
    g.fillStyle(O, 1).fillTriangle(240, 225, 260, 225, 250, 238);
    g.fillStyle(0xf28fa5, 1).fillTriangle(243, 227, 257, 227, 250, 235);
    g.lineStyle(3, O, 1);
    g.beginPath().arc(244, 240, 6, 0.1 * Math.PI, 0.95 * Math.PI).strokePath();
    g.beginPath().arc(256, 240, 6, 0.05 * Math.PI, 0.9 * Math.PI).strokePath();
    g.lineStyle(3, O, 0.85);
    [[206, 236, 158, 226], [206, 244, 156, 246], [208, 252, 162, 266]].forEach(([x1, y1, x2, y2]) => {
      g.lineBetween(x1, y1, x2, y2);
      g.lineBetween(500 - x1, y1, 500 - x2, y2);
    });

    // 통통한 앞발
    [214, 286].forEach((x) => {
      g.fillStyle(O, 1).fillEllipse(x, 398, 70, 46);
      g.fillStyle(ORANGE, 1).fillEllipse(x, 397, 62, 38);
      g.fillStyle(0xfbbf6a, 1).fillEllipse(x - 6, 388, 30, 10);
      g.lineStyle(3, O, 0.8).lineBetween(x - 9, 404, x - 9, 414).lineBetween(x + 9, 404, x + 9, 414);
    });

    // ★ Spot 1: 왼쪽 귀 리본 (원본 노랑 / 틀린 그림 빨강)
    const ribbon = R ? 0xef4444 : 0xfacc15, ribbonD = R ? 0xb91c1c : 0xca8a04;
    g.fillStyle(O, 1).fillTriangle(190, 128, 154, 106, 156, 152).fillTriangle(190, 128, 226, 106, 224, 152);
    g.fillStyle(ribbon, 1).fillTriangle(186, 128, 159, 112, 161, 146).fillTriangle(194, 128, 221, 112, 219, 146);
    g.fillStyle(ribbonD, 1).fillTriangle(186, 132, 161, 146, 166, 136).fillTriangle(194, 132, 219, 146, 214, 136);
    g.fillStyle(O, 1).fillCircle(190, 128, 11);
    g.fillStyle(ribbon, 1).fillCircle(190, 128, 8);
    g.fillStyle(0xffffff, 0.7).fillCircle(187, 125, 2.5);

    // ★ Spot 2: 털실 뭉치 (원본 파랑 / 틀린 그림 초록) + 앞발까지 이어진 실
    const yarn = R ? 0x4ade80 : 0x60a5fa, yarnD = R ? 0x16a34a : 0x2563eb, yarnL = R ? 0xbbf7d0 : 0xbfdbfe;
    g.lineStyle(4, yarnD, 1).strokePoints([{ x: 344, y: 412 }, { x: 326, y: 418 }, { x: 312, y: 410 }, { x: 300, y: 404 }]);
    g.fillStyle(O, 1).fillCircle(372, 408, 35);
    g.fillStyle(yarn, 1).fillCircle(372, 408, 31);
    g.lineStyle(3, yarnD, 1);
    g.beginPath().arc(360, 400, 26, -0.4, 1.3).strokePath();
    g.beginPath().arc(384, 414, 24, 2.4, 4.2).strokePath();
    g.beginPath().arc(372, 396, 22, 0.3, 2.6).strokePath();
    g.fillStyle(yarnL, 1).fillEllipse(362, 394, 14, 7);
  }

  class CatDifferenceScene extends CloseupScene {
    constructor() { super("PUZZLE_CAT_DIFFERENCE", "🐱 무전기 수신 테스트"); this.backTo = "CLOSEUP_BOAT"; }

    drawScene() {
      const F = GameState.flags;
      F.catFound = F.catFound || [];
      this.done = false;

      // 배경: 조타실 나무 벽
      const bg = this.add.graphics();
      bg.fillStyle(0x5b3a1e, 1).fillRect(0, 0, GAME_W, VIEW_H);
      bg.lineStyle(2, 0x4a2f17, 1);
      for (let y = 24; y < VIEW_H; y += 44) bg.lineBetween(0, y, GAME_W, y);

      // 좌/우 그림 패널 (우드 액자)
      this.panels = [
        { x: CAT.LEFT_X, y: CAT.TOP, variant: "left", tag: "원본", ringColor: 0x22c55e },
        { x: CAT.RIGHT_X, y: CAT.TOP, variant: "right", tag: "다른 그림", ringColor: 0xec4899 },
      ];
      this.panels.forEach((p) => {
        const fr = this.add.graphics();
        fr.fillStyle(C.outline, 1).fillRoundedRect(p.x - 14, p.y - 14, CAT.W + 28, CAT.H + 28, 18);
        fr.fillStyle(C.wood, 1).fillRoundedRect(p.x - 10, p.y - 10, CAT.W + 20, CAT.H + 20, 15);
        fr.fillStyle(C.woodLight, 1).fillRoundedRect(p.x - 2, p.y - 9, CAT.W + 4, 5, 3);
        fr.fillStyle(C.outline, 1).fillRect(p.x - 3, p.y - 3, CAT.W + 6, CAT.H + 6);
        p.art = this.add.container(p.x, p.y);
        const g = this.add.graphics();
        paintCatRoom(g, p.variant);
        p.art.add(g);
        p.marks = this.add.container(p.x, p.y).setDepth(20);
        // 패널 이름표
        const tag = this.add.text(p.x + 16, p.y + 12, p.tag, textStyle({ fontSize: "15px", fontStyle: "bold", color: C.cream, backgroundColor: "#6b4423", padding: { x: 9, y: 3 } })).setDepth(21);
        // 터치 영역: 어느 쪽 그림을 눌러도 같은 판정
        const zone = this.add.zone(p.x + CAT.W / 2, p.y + CAT.H / 2, CAT.W, CAT.H).setInteractive({ useHandCursor: true });
        zone.on("pointerdown", (ptr) => this.handleTap(ptr.x, ptr.y));
        if (DEBUG) CAT_SPOTS.forEach((s) => s.hits.forEach(([hx, hy]) => this.add.circle(p.x + hx, p.y + hy, CAT.HIT_R).setStrokeStyle(2, 0xff0055).setDepth(90)));
        void tag;
      });

      // 상단 안내 바
      this.guideBar = this.add.graphics().setDepth(30);
      this.guideText = this.add.text(GAME_W / 2, 79, "", textStyle({ fontSize: "19px", fontStyle: "bold", color: C.ink })).setOrigin(0.5).setDepth(31);
      this.updateGuide();

      // ★ 시연용 [즉시 완료] (우측 하단 구석)
      this.btnCheat = make3DButton(this, 1226, 548, 94, 40, "⚡ 즉시 완료", "stone", () => {
        if (!this.done && !GameState.busy) this.cheat();
      }, 14).setAlpha(0.8).setDepth(40);

      // 이미 찾은 곳은 다시 표시 (뒤로 갔다 돌아온 경우)
      CAT_SPOTS.forEach((s) => { if (F.catFound.includes(s.id)) this.drawFoundMark(s, false); });

      if (!F.catIntroShown) {
        F.catIntroShown = true;
        say(
          narr("무전기 화면에 수신 테스트용 그림 두 장이 떴다. 선장님네 고양이 사진이다!"),
          "두 그림에서 다른 곳 3군데를 찾으면 신호가 잡힐 것 같아!"
        );
      }
    }

    remaining() { return CAT_SPOTS.length - GameState.flags.catFound.length; }

    updateGuide() {
      const left = this.remaining();
      this.guideText.setText(`🐱 귀여운 고양이의 다른 곳 3군데를 찾아 터치하세요! (남은 개수: ${left}/3)`);
      const w = Math.ceil(this.guideText.width) + 44;
      const g = this.guideBar.clear();
      g.fillStyle(C.outline, 1).fillRoundedRect(GAME_W / 2 - w / 2 - 3, 59, w + 6, 42, 14);
      g.fillStyle(C.paperShade, 1).fillRoundedRect(GAME_W / 2 - w / 2, 62, w, 36, 11);
      g.fillStyle(left === 0 ? 0xd9f99d : C.paper, 1).fillRoundedRect(GAME_W / 2 - w / 2, 62, w, 32, 11);
    }

    /** 화면 좌표 → 어느 패널이든 그림 안 좌표로 바꿔 판정 */
    handleTap(x, y) {
      if (this.done || GameState.busy || this.transitioning) return;
      const p = this.panels.find((q) => x >= q.x && x <= q.x + CAT.W && y >= q.y && y <= q.y + CAT.H);
      if (!p) return;
      const lx = x - p.x, ly = y - p.y;
      const found = GameState.flags.catFound;
      const spot = CAT_SPOTS.find((s) => s.hits.some(([hx, hy]) => Math.hypot(lx - hx, ly - hy) <= CAT.HIT_R));
      if (spot && !found.includes(spot.id)) {
        found.push(spot.id);
        this.drawFoundMark(spot, true);
        this.updateGuide();
        this.tweens.add({ targets: this.guideText, scale: 1.08, duration: 120, yoyo: true });
        toast(`⭕ 찾았다! ${spot.name}  (남은 개수: ${this.remaining()}/3)`);
        if (this.remaining() === 0) this.onCleared();
      } else if (spot) {
        toast("이미 찾은 곳이에요!");
      } else {
        this.wrongMark(x, y);
      }
    }

    /** 정답: 좌(초록)·우(분홍) 양쪽에 동그라미가 통! 하고 커졌다 자리 잡음 */
    drawFoundMark(spot, animate) {
      this.panels.forEach((p) => {
        const r = spot.ring;
        const m = this.add.graphics();
        m.lineStyle(11, 0xffffff, 0.9).strokeEllipse(0, 0, r.w, r.h);
        m.lineStyle(6, p.ringColor, 1).strokeEllipse(0, 0, r.w, r.h);
        m.setPosition(r.x, r.y);
        p.marks.add(m);
        if (!animate) return;
        m.setScale(1.7).setAlpha(0);
        this.tweens.add({ targets: m, scale: 1, alpha: 1, duration: 380, ease: "Back.easeOut" });
        const s = this.add.graphics().setPosition(r.x + r.w / 2 - 6, r.y - r.h / 2 + 6);
        drawStar(s, 12);
        p.marks.add(s);
        this.tweens.add({ targets: s, scale: { from: 0.2, to: 1.3 }, alpha: { from: 1, to: 0 }, angle: 90, duration: 600, onComplete: () => s.destroy() });
      });
    }

    /** 오답: 빨간 ❌가 0.5초 떴다가 사라짐 */
    wrongMark(x, y) {
      const xm = this.add.graphics().setPosition(x, y).setDepth(60);
      xm.lineStyle(14, 0xffffff, 0.95).lineBetween(-16, -16, 16, 16).lineBetween(16, -16, -16, 16);
      xm.lineStyle(8, 0xef4444, 1).lineBetween(-16, -16, 16, 16).lineBetween(16, -16, -16, 16);
      xm.setScale(0.5);
      this.tweens.add({ targets: xm, scale: 1, duration: 110, ease: "Back.easeOut" });
      this.tweens.add({ targets: xm, y: y - 12, alpha: 0, duration: 260, delay: 240, onComplete: () => xm.destroy() });
    }

    /** 시연용: 남은 곳을 순서대로 자동으로 찾음 (기록 +10분, 한 판에 한 번) */
    cheat() {
      const F = GameState.flags;
      if (!F.usedTestPass) GameState.penaltySec += TEST_PASS_PENALTY_SEC;
      F.usedTestPass = true;
      toast(`⚡ 즉시 완료 — 기록 +${TEST_PASS_PENALTY_SEC / 60}분`);
      GameState.busy = true;
      const left = CAT_SPOTS.filter((s) => !F.catFound.includes(s.id));
      left.forEach((s, i) => this.time.delayedCall(180 * i, () => {
        F.catFound.push(s.id);
        this.drawFoundMark(s, true);
        this.updateGuide();
        if (this.remaining() === 0) { GameState.busy = false; this.onCleared(); }
      }));
      if (!left.length) { GameState.busy = false; this.onCleared(); }
    }

    /** 클리어: 고양이가 안테나를 건드려 신호 연결 → 즉시 HAPPY END + 서버 전송 */
    onCleared() {
      if (this.done) return;
      this.done = true;
      GameState.flags.catSolved = true;
      GameState.busy = true;
      GameState.endTime = Date.now();               // 타이머 정지
      setBackButton(null);

      this.panels.forEach((p) => this.tweens.add({ targets: [p.art, p.marks], y: p.y - 14, duration: 160, yoyo: true, repeat: 1, ease: "Quad.easeOut" }));
      this.cameras.main.flash(300, 190, 255, 200);

      const banner = this.add.text(GAME_W / 2, 330, "📡 삐빅! 신호 연결!", textStyle({
        fontSize: "46px", fontStyle: "bold", color: C.cream, stroke: "#3e2410", strokeThickness: 7,
        backgroundColor: "rgba(43,29,20,0.78)", padding: { x: 26, y: 14 },
      })).setOrigin(0.5).setDepth(80).setScale(0.4).setAlpha(0);
      this.tweens.add({ targets: banner, scale: 1, alpha: 1, duration: 320, ease: "Back.easeOut" });

      say(narr("고양이가 무전기 안테나를 건드려 신호가 연결되었습니다!"));
      this.time.delayedCall(2300, () => showEnding({
        type: "SUCCESS",
        emoji: "🎉🚢",
        title: "퇴근 성공 (HAPPY END)",
        message: "🎉 퇴근하기 성공!!\n큰 배가 나타나 두 명을 구조했습니다!",
        solvedQuiz: true,
      }));
    }
  }

  /* =====================================================================
   *  11. UI 씬 (우드 인벤토리 · 양피지 대사창 · HUD · 토스트 · 뒤로가기 · 선택지 · 엔딩)
   * ===================================================================== */
  class UIScene extends Phaser.Scene {
    constructor() { super("UIScene"); }

    create() {
      this.createInventoryBar();
      this.createDialogue();
      this.createHUD();
      this.createToast();
      this.createBackButton();
      this.createQuest();
      this.createCursorItem();

      const ev = GameState.events;
      const handlers = {
        "inventory-changed": this.onInventoryChanged,
        "selection-changed": this.onSelectionChanged,
        "slot-bump": this.bumpSlot,
        quest: this.setQuest,
        say: this.onSay,
        toast: this.showToast,
        "set-back": this.setBack,
        choice: this.showChoice,
        ending: this.showEnding,
        "hide-dialogue": this.hideDialogue,
      };
      Object.entries(handlers).forEach(([k, fn]) => ev.on(k, fn, this));
      this.events.once("shutdown", () => Object.entries(handlers).forEach(([k, fn]) => ev.off(k, fn, this)));

      if (DEBUG === "fsm") {
        Inventory.add("branch", 10); ["magazine", "lighter", "pot_water", "ramen_raw", "recipe"].forEach((id) => Inventory.add(id));
      }
      if (DEBUG === "ramen") {
        Inventory.add("ramen_cooked");
        this.setQuest("📌 부장님께 라면 가져가기");
      }
    }

    /* ── 선택한 아이템이 손가락/마우스를 따라다니는 플로팅 아이콘 ── */
    createCursorItem() {
      this.cursorTarget = { x: GAME_W / 2, y: VIEW_H - 40 };
      const ci = (this.cursorItem = this.add.container(0, 0).setDepth(500).setVisible(false));
      const g = this.add.graphics();
      g.fillStyle(0x000000, 0.22).fillEllipse(4, 34, 48, 12);
      g.fillStyle(C.outline, 1).fillCircle(0, 0, 33);
      g.fillStyle(0xffc53d, 1).fillCircle(0, 0, 30);
      g.fillStyle(0xffe08a, 1).fillCircle(0, -3, 27);
      g.fillStyle(C.paper, 1).fillCircle(0, 0, 25);
      this.cursorImg = this.add.image(0, 0, "icon_branch").setDisplaySize(44, 44);
      ci.add([g, this.cursorImg]);
      this.tweens.add({ targets: this.cursorImg, angle: { from: -8, to: 8 }, duration: 700, yoyo: true, repeat: -1, ease: "Sine.easeInOut" });

      this.input.on("pointermove", (p) => this.trackPointer(p));
      this.input.on("pointerdown", (p) => {
        this.trackPointer(p);
        if (ci.visible) ci.setPosition(this.cursorTarget.x, this.cursorTarget.y);   // 터치는 순간이동
      });
    }

    /** 손가락 터치는 손끝에 가리지 않게 위쪽으로, 마우스는 커서 오른쪽 아래로 */
    trackPointer(p) {
      const touch = !!p.wasTouch;
      this.cursorTarget.x = Phaser.Math.Clamp(p.x + (touch ? 0 : 30), 34, GAME_W - 34);
      this.cursorTarget.y = Phaser.Math.Clamp(p.y + (touch ? -64 : 30), 34, GAME_H - 34);
    }

    onSelectionChanged(id) {
      this.refreshInventory();
      const ci = this.cursorItem;
      this.tweens.killTweensOf(ci);
      if (id) {
        if (this.input.activePointer) this.trackPointer(this.input.activePointer);
        this.cursorImg.setTexture("icon_" + id).setDisplaySize(44, 44);
        ci.setPosition(this.cursorTarget.x, this.cursorTarget.y).setVisible(true).setAlpha(1).setScale(0.3);
        this.tweens.add({ targets: ci, scale: 1, duration: 220, ease: "Back.easeOut" });
      } else if (ci.visible) {
        this.tweens.add({ targets: ci, scale: 0, alpha: 0, duration: 160, ease: "Quad.easeIn", onComplete: () => ci.setVisible(false) });
      }
    }

    update(time, delta) {
      const ci = this.cursorItem;
      if (!ci || !ci.visible) return;
      const k = 1 - Math.exp(-delta / 55);              // 부드럽게 따라붙기
      ci.x += (this.cursorTarget.x - ci.x) * k;
      ci.y += (this.cursorTarget.y - ci.y) * k;
    }

    /* ── 퀘스트 안내 배너 (HUD 아래, 다음 할 일 고정 표시) ── */
    createQuest() {
      this.questBox = this.add.container(16, 72).setDepth(45).setVisible(false);
      this.questGlow = this.add.graphics();
      this.questPlate = this.add.graphics();
      this.questText = this.add.text(24, 23, "", textStyle({ fontSize: "17px", fontStyle: "bold", color: C.ink })).setOrigin(0, 0.5);
      this.questBox.add([this.questGlow, this.questPlate, this.questText]);
    }

    setQuest(text) {
      const b = this.questBox;
      this.tweens.killTweensOf([b, this.questGlow]);
      if (!text) {
        if (b.visible) this.tweens.add({ targets: b, alpha: 0, duration: 250, onComplete: () => b.setVisible(false) });
        return;
      }
      this.questText.setText(text);
      const w = Math.ceil(this.questText.width) + 46;
      this.questGlow.clear().fillStyle(0xffd34d, 1).fillRoundedRect(-8, -8, w + 16, 62, 20);
      const p = this.questPlate.clear();
      p.fillStyle(C.outline, 1).fillRoundedRect(-3, -3, w + 6, 52, 15);
      p.fillStyle(C.paperShade, 1).fillRoundedRect(0, 0, w, 46, 12);
      p.fillStyle(C.paper, 1).fillRoundedRect(0, 0, w, 41, 12);
      p.fillStyle(0xe8590c, 1).fillRoundedRect(0, 0, 10, 46, { tl: 12, bl: 12, tr: 0, br: 0 });
      b.setVisible(true).setAlpha(1).setX(-w - 20);
      this.questGlow.setAlpha(0);
      this.tweens.add({ targets: b, x: 16, duration: 480, ease: "Back.easeOut" });
      this.tweens.add({ targets: this.questGlow, alpha: { from: 0.55, to: 0 }, duration: 700, delay: 480, repeat: 3 });
      if (this.backBtn.visible) {                          // 클로즈업이면 "뒤로가기"로 시선 유도
        this.tweens.add({ targets: this.backBtn, scale: 1.1, duration: 260, yoyo: true, repeat: 3, delay: 600 });
      }
    }

    /* ── 우드 인벤토리 바 + 베이지 슬롯 ── */
    createInventoryBar() {
      const g = this.add.graphics();
      const Y = VIEW_H;
      // 어두운 반투명 우드 패널 (뒤의 모래사장이 은은하게 비침)
      g.fillStyle(0x000000, 0.25).fillRoundedRect(10, Y + 9, GAME_W - 20, GAME_H - Y - 12, 22);
      g.fillStyle(C.woodDark, 0.85).fillRoundedRect(8, Y + 5, GAME_W - 16, GAME_H - Y - 12, 22);
      g.fillStyle(0x7a4a24, 0.55).fillRoundedRect(14, Y + 11, GAME_W - 28, GAME_H - Y - 24, 18);
      g.fillStyle(C.woodLight, 0.6).fillRoundedRect(30, Y + 13, GAME_W - 60, 4, 2);
      g.lineStyle(3, C.wood, 0.9).strokeRoundedRect(8, Y + 5, GAME_W - 16, GAME_H - Y - 12, 22);
      g.fillStyle(C.woodDark, 0.9);
      [[24, Y + 20], [GAME_W - 24, Y + 20], [24, GAME_H - 22], [GAME_W - 24, GAME_H - 22]].forEach(([x, y]) => g.fillCircle(x, y, 3.5));
      this.add.zone(GAME_W / 2, Y + 60, GAME_W, 120).setInteractive();

      const { SW, SH } = INV;

      this.slots = [];
      for (let i = 0; i < SLOT_COUNT; i++) {
        const { x, y: cy } = slotCenter(i);
        const slot = {
          x, y: cy, w: SW, h: SH,
          bg: this.add.graphics(),
          icon: this.add.image(x, cy - 11, "icon_branch").setDisplaySize(56, 56).setVisible(false),
          name: this.add.text(x, cy + 29, "", textStyle({ fontSize: "15px", fontStyle: "bold", color: C.ink })).setOrigin(0.5),
          badge: this.add.graphics(),
          count: this.add.text(x + SW / 2 - 18, cy - SH / 2 + 15, "", textStyle({ fontSize: "14px", fontStyle: "bold", color: C.cream })).setOrigin(0.5),
        };
        slot.baseScale = slot.icon.scaleX;
        this.add.zone(x, cy, SW, SH).setInteractive({ useHandCursor: true }).on("pointerdown", () => this.onSlotTap(i));
        this.slots.push(slot);
      }
      this.refreshInventory();
    }

    refreshInventory() {
      this.slots.forEach((s, i) => {
        const item = GameState.inventory[i];
        const def = item && ITEMS[item.id];
        const selected = !!item && GameState.selected === item.id;
        const L = s.x - s.w / 2, T = s.y - s.h / 2, W = s.w, H = s.h;

        s.bg.clear();
        if (selected) s.bg.fillStyle(0xffe08a, 0.45).fillRoundedRect(L - 9, T - 9, W + 18, H + 18, 22);
        s.bg.fillStyle(C.outline, 1).fillRoundedRect(L - 4, T - 4, W + 8, H + 8, 18);            // 두꺼운 어두운 테두리
        s.bg.fillStyle(selected ? 0xffc53d : C.wood, 1).fillRoundedRect(L, T, W, H, 15);          // 프레임 (선택 시 금색)
        s.bg.fillStyle(selected ? 0xffe08a : C.woodLight, 1).fillRoundedRect(L + 5, T + 3, W - 10, 5, 3);
        s.bg.fillStyle(C.paperShade, 1).fillRoundedRect(L + 7, T + 7, W - 14, H - 14, 10);       // 안쪽 그림자 톤
        s.bg.fillStyle(def ? C.paper : 0xe6d2a8, 1).fillRoundedRect(L + 8, T + 13, W - 16, H - 21, 9);
        if (def) s.bg.fillStyle(def.color, 0.12).fillRoundedRect(L + 8, T + 13, W - 16, H - 21, 9);

        s.icon.setVisible(!!def);
        if (def) s.icon.setTexture("icon_" + item.id).setDisplaySize(56, 56);
        s.name.setText(def ? def.name : "").setColor(selected ? "#9a3412" : C.ink);

        s.badge.clear();
        const countLabel = def ? (def.max > 1 ? `${item.count}/${def.max}` : item.count > 1 ? `x${item.count}` : "") : "";
        s.count.setText(countLabel);
        if (countLabel) {
          const bw = s.count.width + 14;
          s.badge.fillStyle(C.outline, 1).fillRoundedRect(s.x + W / 2 - 18 - bw / 2 - 2, T + 4, bw + 4, 24, 10);
          s.badge.fillStyle(0x9a3412, 1).fillRoundedRect(s.x + W / 2 - 18 - bw / 2, T + 6, bw, 20, 8);
          s.count.setX(s.x + W / 2 - 18);
        }
      });
    }

    onInventoryChanged({ id, delta, quiet }) {
      this.refreshInventory();
      if (delta > 0 && !quiet) this.bumpSlot(id);
    }

    /** 슬롯 아이콘 통통 튕기기 (줍기 연출이 슬롯에 도착하는 순간) */
    bumpSlot(id) {
      const s = this.slots[GameState.inventory.findIndex((i) => i.id === id)];
      if (!s) return;
      this.tweens.killTweensOf(s.icon);
      s.icon.setDisplaySize(56, 56);
      const base = s.icon.scaleX;
      this.tweens.add({ targets: s.icon, scaleX: base * 1.4, scaleY: base * 1.4, duration: 140, yoyo: true, ease: "Quad.easeOut" });
    }

    onSlotTap(i) {
      if (GameState.busy) return;
      const item = GameState.inventory[i];
      if (!item) { Inventory.select(null); return; }
      if (GameState.selected === item.id) { Inventory.select(null); return; }
      Inventory.select(item.id);
      const def = ITEMS[item.id];
      if (def.onSelect) def.onSelect();
      else toast(`👉 ${def.name} 선택 — 사용할 곳을 터치하세요`);
    }

    /* ── 상단 반투명 대사창: 부드럽게 나타나고, 2.5~3초 뒤 저절로 사라짐 · 터치하면 넘김/닫기 ── */
    createDialogue() {
      const W = (this.dlgW = 580);                       // 좌측 HUD(이름표)와 우측 [뒤로가기] 사이에 들어가는 폭
      this.dlgTop = 10;
      this.dlg = this.add.container(GAME_W / 2, this.dlgTop).setDepth(50).setVisible(false).setAlpha(0);
      this.dlgBg = this.add.graphics();
      this.dlgSpeaker = this.add.text(-W / 2 + 20, 9, "", textStyle({ fontSize: "15px", fontStyle: "bold", color: "#f3c969" }));
      this.dlgText = this.add.text(-W / 2 + 20, 10, "", textStyle({
        fontSize: "19px", color: "#fdf6e3", lineSpacing: 5, wordWrap: { width: W - 64, useAdvancedWrap: true },
      }));
      this.dlgArrow = this.add.text(W / 2 - 20, 0, "", textStyle({ fontSize: "14px", fontStyle: "bold", color: "#f3c969" })).setOrigin(0.5);
      this.tweens.add({ targets: this.dlgArrow, alpha: 0.25, duration: 500, yoyo: true, repeat: -1 });
      this.dlgHit = this.add.zone(0, 0, W, 60).setOrigin(0.5, 0).setInteractive({ useHandCursor: true });
      this.dlgHit.on("pointerdown", () => this.advanceDialogue());
      this.dlg.add([this.dlgBg, this.dlgSpeaker, this.dlgText, this.dlgArrow, this.dlgHit]);
      this.dlgQueue = [];
    }

    /** 대사 한 줄 분량에 맞춰 상자 높이를 다시 그림 (타이핑 중에 상자가 출렁이지 않도록 전체 문장으로 미리 측정) */
    layoutDialogue(ln) {
      const W = this.dlgW, hasSpeaker = !!ln.speaker;
      this.dlgSpeaker.setText(ln.speaker || "");
      this.dlgText.setY(hasSpeaker ? 31 : 12).setText(ln.text)
        .setColor(hasSpeaker ? "#fdf6e3" : "#e9dcc0").setFontStyle(hasSpeaker ? "normal" : "italic");
      const H = Math.ceil(this.dlgText.y + this.dlgText.height + 12);
      const g = this.dlgBg.clear();
      g.fillStyle(0x000000, 0.22).fillRoundedRect(-W / 2 + 3, 4, W, H, 12);          // 은은한 그림자
      g.fillStyle(0x1e140c, 0.72).fillRoundedRect(-W / 2, 0, W, H, 12);             // 짙은 밤색 반투명 배경
      g.lineStyle(2, 0xd9b26a, 0.95).strokeRoundedRect(-W / 2, 0, W, H, 12);         // 얇은 골드 테두리
      g.lineStyle(1, 0xfff1c9, 0.16).strokeRoundedRect(-W / 2 + 4, 4, W - 8, H - 8, 9);
      if (hasSpeaker) g.fillStyle(0xd9b26a, 0.55).fillRect(-W / 2 + 20, 28, Math.min(this.dlgSpeaker.width, W - 60), 1);
      this.dlgArrow.setPosition(W / 2 - 18, H - 15);
      this.dlgHit.setSize(W, H);
    }

    onSay(lines) {
      this.dlgQueue = [...lines];
      this.tweens.killTweensOf(this.dlg);
      const wasHidden = !this.dlg.visible || this.dlg.alpha < 0.05;
      this.dlg.setVisible(true);
      if (wasHidden) this.dlg.setAlpha(0).setY(this.dlgTop - 12);
      this.tweens.add({ targets: this.dlg, alpha: 1, y: this.dlgTop, duration: 200, ease: "Quad.easeOut" });   // 페이드 인
      GameState.events.emit("dialog", true);
      this.nextLine();
    }

    nextLine() {
      this.clearDialogueTimer();
      const ln = this.dlgQueue.shift();
      if (!ln) { this.hideDialogue(); return; }

      this.layoutDialogue(ln);
      this.dlgArrow.setVisible(false);
      const chars = Array.from(ln.text);
      this.fullText = ln.text;
      this.dlgChars = chars.length;
      this.typing = true;
      let i = 0;
      this.dlgText.setText("");
      if (this.typeEvent) this.typeEvent.remove();
      this.typeEvent = this.time.addEvent({
        delay: 24, repeat: chars.length - 1,
        callback: () => {
          i++;
          this.dlgText.setText(chars.slice(0, i).join(""));
          if (i >= chars.length) this.finishTyping();
        },
      });
    }

    finishTyping() {
      this.typing = false;
      if (this.typeEvent) { this.typeEvent.remove(); this.typeEvent = null; }
      this.dlgText.setText(this.fullText);
      const more = this.dlgQueue.length > 0;
      this.dlgArrow.setText(more ? "▶" : "✕").setVisible(true);
      // 터치가 없으면: 다음 줄이 있으면 자동으로 넘기고, 마지막 줄이면 서서히 사라짐
      // 짧은 문장은 약 2.6초, 긴 힌트 대사는 읽을 시간을 조금 더 줌 (최대 6초)
      const hold = Phaser.Math.Clamp(1600 + (this.dlgChars || 0) * 45, 2600, 6000);
      this.autoHide = this.time.delayedCall(hold, () => (more ? this.nextLine() : this.fadeOutDialogue()));
    }

    advanceDialogue() {
      if (this.typing) this.finishTyping();
      else if (this.dlgQueue.length) this.nextLine();
      else this.hideDialogue();                          // 마지막 줄에서 터치하면 즉시 닫기
    }

    clearDialogueTimer() {
      if (this.autoHide) { this.autoHide.remove(); this.autoHide = null; }
    }

    /** 자동 페이드 아웃 (서서히 투명해지며 살짝 위로) */
    fadeOutDialogue() {
      this.clearDialogueTimer();
      this.tweens.killTweensOf(this.dlg);
      this.tweens.add({
        targets: this.dlg, alpha: 0, y: this.dlgTop - 8, duration: 500, ease: "Quad.easeIn",
        onComplete: () => this.dlg.setVisible(false),
      });
      GameState.events.emit("dialog", false);
    }

    /** 즉시 닫기 (터치 · 선택지/엔딩 열림 · 장면 전환) */
    hideDialogue() {
      this.clearDialogueTimer();
      if (this.typeEvent) { this.typeEvent.remove(); this.typeEvent = null; }
      this.typing = false;
      this.dlgQueue = [];
      if (!this.dlg.visible) return;
      this.tweens.killTweensOf(this.dlg);
      this.tweens.add({ targets: this.dlg, alpha: 0, duration: 140, onComplete: () => this.dlg.setVisible(false) });
      GameState.events.emit("dialog", false);
    }

    /* ── HUD: 우드 명찰 ── */
    createHUD() {
      this.hudPlate = this.add.graphics().setDepth(39);
      this.hud = this.add.text(36, 37, "", textStyle({ fontSize: "18px", fontStyle: "bold", color: C.cream, stroke: "#3e2410", strokeThickness: 3 })).setOrigin(0, 0.5).setDepth(40);
      this.hudW = 0;
      const update = () => {
        this.hud.setText(`👔 ${GameState.playerName} 사원   ⏱ ${fmtTime(GameState.elapsedSec)}`);
        const w = Math.ceil(this.hud.width + 40);
        if (w !== this.hudW) {
          this.hudW = w;
          this.hudPlate.clear();
          drawWood(this.hudPlate, 16, 16, w, 44, 12);
        }
      };
      update();
      this.time.addEvent({ delay: 1000, loop: true, callback: update });
    }

    /* ── 토스트: 우드 리본 ── */
    createToast() {
      this.toastBox = this.add.container(GAME_W / 2, VIEW_H - 46).setDepth(60).setAlpha(0);
      this.toastPlate = this.add.graphics();
      this.toastText = this.add.text(0, -2, "", textStyle({ fontSize: "21px", fontStyle: "bold", color: C.cream, stroke: "#3e2410", strokeThickness: 4 })).setOrigin(0.5);
      this.toastBox.add([this.toastPlate, this.toastText]);
    }

    showToast(msg) {
      const b = this.toastBox;
      this.tweens.killTweensOf(b);
      if (this.toastTimer) this.toastTimer.remove();
      this.toastText.setText(msg);
      const w = this.toastText.width + 48;
      this.toastPlate.clear();
      drawWood(this.toastPlate, -w / 2, -24, w, 46, 14);
      b.setAlpha(0).setY(VIEW_H - 30);
      this.tweens.add({ targets: b, alpha: 1, y: VIEW_H - 46, duration: 180, ease: "Quad.easeOut" });
      this.toastTimer = this.time.delayedCall(1700, () => this.tweens.add({ targets: b, alpha: 0, duration: 300 }));
    }

    /* ── 뒤로가기: 3D 우드 버튼 ── */
    createBackButton() {
      this.backBtn = make3DButton(this, GAME_W - 112, 36, 184, 48, "← 뒤로가기", "wood", () => {
        if (this.backHandler && !GameState.busy) this.backHandler();
      }, 20).setDepth(70).setVisible(false);
    }

    setBack(handler) {
      this.backHandler = handler;
      this.backBtn.setVisible(!!handler);
    }

    /* ── 2지선다 팝업: 양피지 패널 + 3D 버튼 ── */
    showChoice({ title, options }) {
      GameState.busy = true;
      this.hideDialogue();
      const L = this.add.container(0, 0).setDepth(200).setAlpha(0);
      const dim = this.add.rectangle(GAME_W / 2, GAME_H / 2, GAME_W, GAME_H, 0x1a0f07, 0.7).setInteractive();
      const panel = this.add.graphics();
      drawParchment(panel, 190, 110, 900, 420, 26);
      const ribbon = this.add.graphics();
      drawWood(ribbon, 400, 88, 480, 48, 14);
      const rt = this.add.text(GAME_W / 2, 110, "선택의 시간", textStyle({ fontSize: "22px", fontStyle: "bold", color: C.cream, stroke: "#3e2410", strokeThickness: 4 })).setOrigin(0.5);
      const t = this.add.text(GAME_W / 2, 196, title, textStyle({ fontSize: "30px", fontStyle: "bold", color: C.ink, align: "center", wordWrap: { width: 800, useAdvancedWrap: true } })).setOrigin(0.5);
      L.add([dim, panel, ribbon, rt, t]);

      let closed = false;
      options.forEach((o, i) => {
        const btn = make3DButton(this, GAME_W / 2, 302 + i * 116, 780, 82, o.label, o.style || "yellow", () => {
          if (closed) return;
          closed = true;
          this.time.delayedCall(80, () => {
            L.destroy();
            GameState.busy = false;
            o.onSelect();
          });
        }, 26);
        L.add(btn);
      });
      this.tweens.add({ targets: L, alpha: 1, duration: 200 });
    }

    /* ── 엔딩 화면 + 결과 전송 ── */
    showEnding({ type, emoji, title, message, solvedQuiz = false }) {
      if (this.endingShown) return;
      this.endingShown = true;
      GameState.busy = true;
      if (!GameState.endTime) GameState.endTime = Date.now();
      this.hideDialogue();
      this.setBack(null);
      this.setQuest(null);
      Inventory.select(null);

      const ok = type === "SUCCESS";
      const L = this.add.container(0, 0).setDepth(300).setAlpha(0);
      const bg = this.add.rectangle(GAME_W / 2, GAME_H / 2, GAME_W, GAME_H, ok ? 0x0f2a1a : 0x1a0a08, 0.93).setInteractive();
      const card = this.add.graphics();
      drawParchment(card, 230, 44, 820, 632, 28);
      const ribbon = this.add.graphics();
      drawWood(ribbon, 420, 206, 440, 64, 16);
      const e = this.add.text(GAME_W / 2, 128, emoji, { fontFamily: EMOJI_FONT, fontSize: "80px", resolution: TEXT_RES }).setOrigin(0.5);
      const t = this.add.text(GAME_W / 2, 236, title, textStyle({ fontSize: "40px", fontStyle: "bold", color: ok ? "#bbf7d0" : "#fecaca", stroke: "#2b1d14", strokeThickness: 6 })).setOrigin(0.5);
      const m = this.add.text(GAME_W / 2, 336, message, textStyle({ fontSize: "27px", fontStyle: "bold", align: "center", lineSpacing: 10, color: C.ink })).setOrigin(0.5);
      const sec = GameState.elapsedSec;
      const penaltyNote = GameState.penaltySec ? `  (⚡ 테스트 패스 +${GameState.penaltySec / 60}분 포함)` : "";
      const info = this.add.text(GAME_W / 2, 424, `👔 ${GameState.playerName} 사원     ⏱ 총 소요 시간 ${fmtTime(sec)} (${sec}초)${penaltyNote}`,
        textStyle({ fontSize: "22px", fontStyle: "bold", color: C.inkSoft })).setOrigin(0.5);
      const status = this.add.text(GAME_W / 2, 478, "📡 결과를 회사 서버에 전송 중…", textStyle({ fontSize: "21px", fontStyle: "bold", color: C.inkSoft })).setOrigin(0.5);
      const btn = make3DButton(this, GAME_W / 2, 574, 380, 72, "🔁 처음부터 다시하기", "yellow", () => location.reload(), 24);

      L.add([bg, card, ribbon, e, t, m, info, status, btn]);
      this.tweens.add({ targets: L, alpha: 1, duration: 700 });
      this.tweens.add({ targets: e, scale: 1.12, duration: 900, yoyo: true, repeat: -1, ease: "Sine.easeInOut" });

      const send = () => {
        status.disableInteractive();
        status.setText("📡 결과를 회사 서버에 전송 중…").setColor(C.inkSoft);
        ApiClient.sendResult(type, solvedQuiz).then((res) => {
          if (res) {
            status.setText(ok && res.rank ? `🏆 리더보드 현재 ${res.rank}위!` : "✅ 결과가 리더보드에 기록되었습니다.").setColor("#2f7d32");
          } else {
            status.setText("⚠️ 전송 실패 — 여기를 탭해서 다시 시도").setColor("#b3261e").setInteractive({ useHandCursor: true });
            status.once("pointerdown", send);
          }
        });
      };
      send();
    }
  }

  /* =====================================================================
   *  12. 시작 모달 → 게임 부팅
   * ===================================================================== */
  const modal = document.getElementById("start-modal");
  const form = document.getElementById("start-form");
  const nameInput = document.getElementById("player-name");
  const startBtn = document.getElementById("start-btn");
  const errorEl = document.getElementById("start-error");

  const cleanName = (v) => v.replace(/\s+/g, " ").trim().slice(0, 20);

  try { nameInput.value = localStorage.getItem("playerName") || ""; } catch (e) {}
  startBtn.disabled = !cleanName(nameInput.value);

  nameInput.addEventListener("input", () => {
    startBtn.disabled = !cleanName(nameInput.value);
    errorEl.textContent = "";
  });

  form.addEventListener("submit", (e) => { e.preventDefault(); startGame(); });

  function requestLandscape() {
    if (!window.matchMedia("(pointer: coarse)").matches) return;
    const el = document.documentElement;
    const fs = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!fs) return;
    Promise.resolve(fs.call(el, { navigationUI: "hide" }))
      .then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock("landscape"))
      .catch(() => {});
  }

  function startGame() {
    const name = cleanName(nameInput.value);
    if (!name) { errorEl.textContent = "이름을 입력해 주세요."; return; }
    if (!window.Phaser) { errorEl.textContent = "게임 엔진을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요."; return; }

    startBtn.disabled = true;
    startBtn.textContent = "출근 중…";
    nameInput.blur();
    try { localStorage.setItem("playerName", name); } catch (e) {}

    requestLandscape();

    GameState.playerName = name;
    GameState.events = new Phaser.Events.EventEmitter();
    GameState.startTime = Date.now();
    if (DEBUG === "radio") Object.assign(GameState.flags, { bossAwake: true, radioUnlocked: true });

    modal.classList.add("hidden");
    document.body.classList.add("playing");
    setTimeout(() => modal.remove(), 400);

    window.game = new Phaser.Game({
      type: Phaser.AUTO,
      parent: "game",
      backgroundColor: "#2a1a0e",
      scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH,
        width: GAME_W,
        height: GAME_H,
      },
      input: { activePointers: 2 },
      render: { antialias: true },
      // BootScene이 아이콘을 만든 뒤 UIScene + IslandScene 시작. UIScene은 맨 뒤 = 항상 최상단
      scene: [BootScene, IslandScene, TreeScene, RocksScene, BagScene, WaterfallScene, JunkScene, BoatScene, CatDifferenceScene, UIScene],
    });
  }

  /* =====================================================================
   *  13. 무전기 비밀번호 모달 (HTML 오버레이 — 모바일 한글 IME 입력 지원)
   * ===================================================================== */
  const pwModal = document.getElementById("pw-modal");
  const pwCard = pwModal.querySelector(".pw-card");
  const pwForm = document.getElementById("pw-form");
  const pwInput = document.getElementById("pw-input");
  const pwSubmit = document.getElementById("pw-submit");
  const pwMsg = document.getElementById("pw-msg");
  let pwOnSuccess = null;

  /** 키보드가 열리며 브라우저가 화면을 밀어 올려도, 팝업은 '지금 보이는 영역'의 맨 위에 붙어 있도록 */
  function pinPasswordCard() {
    const vv = window.visualViewport;
    if (!vv) return;
    pwCard.style.top = `${Math.round(vv.offsetTop + Math.max(6, vv.height * 0.03))}px`;
  }
  function resetPageScroll() {
    window.scrollTo(0, 0);
    document.documentElement.scrollTop = 0;
    document.body.scrollTop = 0;
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", () => { if (!pwModal.classList.contains("hidden")) pinPasswordCard(); });
    window.visualViewport.addEventListener("scroll", () => { if (!pwModal.classList.contains("hidden")) pinPasswordCard(); });
  }
  pwInput.addEventListener("focus", () => setTimeout(() => { resetPageScroll(); pinPasswordCard(); }, 50));
  // 팝업 바깥(어두운 배경)을 끌어도 페이지가 스크롤되지 않게
  pwModal.addEventListener("touchmove", (e) => { if (e.target === pwModal) e.preventDefault(); }, { passive: false });

  function openPasswordModal(onSuccess) {
    pwOnSuccess = onSuccess;
    GameState.busy = true;
    GameState.events.emit("hide-dialogue");
    pwInput.value = "";
    pwInput.disabled = false;
    pwSubmit.disabled = false;
    pwMsg.textContent = "";
    pwMsg.className = "msg";
    document.body.classList.add("pw-open");
    pwModal.classList.remove("hidden");
    pinPasswordCard();
    setTimeout(() => {
      try { pwInput.focus({ preventScroll: true }); } catch (e) { pwInput.focus(); }
      resetPageScroll();
    }, 60);
  }

  function closePasswordModal() {
    pwInput.blur();
    pwModal.classList.add("hidden");
    document.body.classList.remove("pw-open");
    pwCard.style.top = "";
    GameState.busy = false;
    // 키보드가 내려간 뒤 캔버스 크기·위치를 원래대로
    setTimeout(() => { resetPageScroll(); if (window.game && window.game.scale) window.game.scale.refresh(); }, 300);
  }

  document.getElementById("pw-cancel").addEventListener("click", closePasswordModal);

  pwForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const answer = pwInput.value.normalize("NFC").trim();
    if (!answer) {
      pwMsg.textContent = "암호를 입력해 주세요. (한글)";
      pwMsg.className = "msg err";
      return;
    }
    if (answer === RADIO_PASSWORD) {
      pwMsg.textContent = "비밀번호 일치! 수신기 전선 회로가 열렸습니다!";
      pwMsg.className = "msg ok";
      pwInput.disabled = true;
      pwSubmit.disabled = true;
      GameState.flags.quizSolved = true;
      setTimeout(() => {
        closePasswordModal();
        if (pwOnSuccess) pwOnSuccess();
      }, 1300);
    } else {
      pwMsg.textContent = "비밀번호가 일치하지 않습니다. (힌트: AI가 텍스트를 쪼개어 처리하는 기본 단위)";
      pwMsg.className = "msg err";
      pwCard.classList.remove("shake");
      void pwCard.offsetWidth;
      pwCard.classList.add("shake");
      pwInput.select();
    }
  });

  document.addEventListener("contextmenu", (e) => e.preventDefault());

  // 콘솔 테스트용
  Object.assign(window, { GameState, Inventory, ApiClient, say });
  </script>
</body>
</html>
