<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#3e2410" />
  <title>살아남아 퇴근하기</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏝️</text></svg>" />

  <!-- Phaser 3: CDN 우선, 실패 시 같은 폴더의 phaser.min.js 사용 (발표장 인터넷 불안정 대비) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
  <script>window.Phaser || document.write('<script src="phaser.min.js"><\/script>');</script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%;
      background: #2a1a0e; color: #4a2c17;
      overflow: hidden; overscroll-behavior: none;
      font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    }
    #game { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
    #game canvas { touch-action: none; display: block; }

    /* ── 공통: 양피지 카드 + 우드 테두리 (Kenney Adventure 톤) ── */
    .card {
      margin: auto; width: min(400px, 100%);
      background: #f5e6c8;
      border: 6px solid #8b5a2b; border-radius: 22px;
      box-shadow:
        0 0 0 3px #3e2410,
        inset 0 7px 0 #e2cc9f,
        0 18px 50px rgba(0,0,0,.55);
      padding: 26px 22px 22px; text-align: center; position: relative;
    }
    .card::before {
      content: ""; position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      width: 54px; height: 9px; border-radius: 9px; background: #8b5a2b; box-shadow: 0 0 0 2px #3e2410;
    }
    .emoji { font-size: 44px; margin-top: 6px; }
    h1 { font-size: 27px; font-weight: 900; letter-spacing: -0.02em; margin-top: 4px; color: #4a2c17; }
    h1 span { color: #c2410c; }
    .sub { color: #6b5440; font-size: 14px; margin-top: 6px; line-height: 1.5; }
    form { margin-top: 16px; }
    label { display: block; text-align: left; font-size: 13px; color: #6b4423; margin-bottom: 6px; font-weight: 800; }
    .input-wrap { position: relative; }
    input {
      width: 100%; font-size: 18px;
      padding: 14px 64px 14px 16px; border-radius: 12px;
      border: 3px solid #a47148; background: #fffaf0; color: #3b2a1a;
      box-shadow: inset 0 3px 0 rgba(74,44,23,.12);
      -webkit-user-select: text; user-select: text;
    }
    input::placeholder { color: #b59a78; }
    input:focus { border-color: #e8a33d; outline: none; }
    .suffix { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: #8a6a4a; font-size: 16px; font-weight: 700; pointer-events: none; }

    /* 3D 모바일 버튼: 위는 밝고 아래는 어두운 음영, 누르면 쑥 들어감 */
    button {
      width: 100%; margin-top: 16px; padding: 13px;
      font-size: 18px; font-weight: 900; font-family: inherit;
      border: 3px solid #3e2410; border-radius: 14px;
      background: linear-gradient(#ffe08a 0 42%, #ffc53d 42%);
      color: #4a2c17;
      box-shadow: 0 5px 0 #c98a12, 0 8px 0 #3e2410;
      cursor: pointer; transition: transform .06s, box-shadow .06s, opacity .2s;
    }
    button:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 #c98a12, 0 4px 0 #3e2410; }
    button:disabled { opacity: .45; }
    button.ghost { background: linear-gradient(#b07a44 0 42%, #8b5a2b 42%); color: #fdf2d8; box-shadow: 0 5px 0 #5a381c, 0 8px 0 #3e2410; }
    button.ghost:active { box-shadow: 0 1px 0 #5a381c, 0 4px 0 #3e2410; }
    .error { color: #b3261e; font-size: 13px; font-weight: 700; min-height: 18px; margin-top: 12px; }
    .tip { color: #8a6a4a; font-size: 12px; margin-top: 2px; }

    /* ── 시작 모달: 노을 바다 배경 ── */
    #start-modal {
      position: fixed; inset: 0; z-index: 20;
      display: flex; overflow-y: auto; padding: 16px;
      background:
        radial-gradient(260px 260px at 50% 62%, rgba(255,210,122,.55), transparent 70%),
        linear-gradient(#1e2a5a 0%, #8a5a7a 38%, #f4a261 62%, #2a9d8f 62.5%, #1d6f8a 100%);
      transition: opacity .35s ease;
    }
    #start-modal.hidden { opacity: 0; pointer-events: none; }

    /* ── 세로 화면 안내 ── */
    #rotate-hint {
      display: none; position: fixed; inset: 0; z-index: 30;
      background: rgba(42,26,14,.97); color: #fdf2d8;
      flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      text-align: center; font-size: 18px; font-weight: 700; padding: 24px;
    }
    #rotate-hint .phone { font-size: 64px; animation: rotate 1.8s ease-in-out infinite; }
    #rotate-hint small { color: #d9c08f; font-weight: 400; font-size: 14px; }
    @keyframes rotate { 0%, 20% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
    @media (orientation: portrait) and (pointer: coarse) {
      body.playing #rotate-hint { display: flex; }
    }

    /* ── 무전기 암호 팝업: 키보드가 화면 아래 절반을 덮어도 보이도록 최상단에 붙인 한 줄짜리 패널 ── */
    #pw-modal {
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(20, 12, 6, 0.55);
      overscroll-behavior: none; touch-action: none;
    }
    #pw-modal.hidden { display: none; }
    .pw-card {
      position: fixed; z-index: 10000;
      top: max(6px, 3vh); left: 50%; transform: translateX(-50%);
      width: min(600px, calc(100vw - 16px));
      background: #f5e6c8; border: 4px solid #8b5a2b; border-radius: 14px;
      box-shadow: 0 0 0 2px #3e2410, inset 0 4px 0 #e2cc9f, 0 10px 28px rgba(0,0,0,.5);
      padding: 7px 10px 9px; text-align: left; touch-action: manipulation;
    }
    .pw-head { display: flex; align-items: baseline; gap: 8px; font-size: 15px; font-weight: 900; color: #4a2c17; line-height: 1.3; }
    .pw-head small { font-size: 12px; font-weight: 800; color: #9a3412; }
    .pw-q { margin: 1px 0 6px; font-size: 13px; line-height: 1.35; color: #6b4423; font-weight: 700; }
    .pw-row { display: flex; gap: 6px; align-items: center; margin: 0; }
    .pw-row input {
      flex: 1 1 auto; min-width: 0;
      font-size: 16px;                      /* 16px 미만이면 iOS가 화면을 확대함 */
      padding: 8px 10px; border-width: 2px; border-radius: 10px;
      text-align: center; font-weight: 800; letter-spacing: 0.08em;
    }
    .pw-row button {
      flex: 0 0 auto; width: auto; margin: 0 0 5px; padding: 8px 14px;
      font-size: 15px; border-width: 2px; border-radius: 10px;
      box-shadow: 0 3px 0 #c98a12, 0 5px 0 #3e2410;
    }
    .pw-row button.ghost { box-shadow: 0 3px 0 #5a381c, 0 5px 0 #3e2410; }
    .pw-row button:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 0 0 #c98a12, 0 2px 0 #3e2410; }
    #pw-msg { margin-top: 4px; min-height: 0; font-size: 12.5px; line-height: 1.35; }
    #pw-msg:empty { display: none; }
    .msg.ok { color: #2f7d32; }
    .msg.err { color: #b3261e; }
    .shake { animation: shake .35s; }
    @keyframes shake { 0%,100% { transform: translateX(-50%); } 20%,60% { transform: translateX(calc(-50% - 8px)); } 40%,80% { transform: translateX(calc(-50% + 8px)); } }
    body.pw-open { position: fixed; inset: 0; overflow: hidden; }
  </style>
</head>
<body>
  <div id="game"></div>

  <div id="start-modal">
    <div class="card">
      <div class="emoji">🏝️</div>
      <h1>살아남아 <span>퇴근하기</span></h1>
      <p class="sub">낚시 워크숍 가던 통통배가 난파됐다.<br/>무인도에서 살아남아 무사히 퇴근하자!</p>
      <form id="start-form" autocomplete="off">
        <label for="player-name">사원 이름을 입력하세요</label>
        <div class="input-wrap">
          <input id="player-name" type="text" maxlength="20" placeholder="예) 김철수" enterkeyhint="go" />
          <span class="suffix">사원</span>
        </div>
        <button id="start-btn" type="submit" disabled>🏢 출근하기</button>
        <div class="error" id="start-error"></div>
        <p class="tip">가로 화면으로 플레이하면 더 편해요</p>
      </form>
    </div>
  </div>

  <div id="rotate-hint">
    <div class="phone">📱</div>
    휴대폰을 가로로 돌려주세요
    <small>화면 회전 잠금이 켜져 있다면 해제해 주세요</small>
  </div>

  <!-- 무전기 암호 입력 (한글 IME 입력을 위해 HTML 오버레이 사용 · 키보드에 가리지 않게 최상단 고정) -->
  <div id="pw-modal" class="hidden">
    <div class="pw-card" role="dialog" aria-labelledby="pw-title">
      <div class="pw-head" id="pw-title">📻 무전기 암호 입력 <small>(한글)</small></div>
      <p class="pw-q">"AI가 텍스트를 처리하는 기본 단위는?"</p>
      <form id="pw-form" class="pw-row" autocomplete="off">
        <input id="pw-input" type="text" maxlength="20" placeholder="암호 입력 (한글)" enterkeyhint="done"
               autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="무전기 암호 (한글)" />
        <button type="submit" id="pw-submit">확인</button>
        <button type="button" id="pw-cancel" class="ghost">닫기</button>
      </form>
      <div class="msg" id="pw-msg"></div>
    </div>
  </div>

  <script>
  /* =====================================================================
   *  0. 공통 설정
   * ===================================================================== */
  const PARAMS = new URLSearchParams(location.search);
  // ?debug=1     → 핫스팟 영역 표시
  // ?debug=fsm   → + 화로 조리 재료 지급
  // ?debug=ramen → + 완성된 라면 지급 (선택지 · BAD END 테스트)
  // ?debug=radio → 부장님 기상 상태로 시작 (무전기 암호 · 배선 퍼즐 바로 테스트)
  const DEBUG = PARAMS.get("debug");

  /* ★ 백엔드 서버 주소 — 비워 두면 지금 접속한 서버(server.py)를 그대로 사용
   *   외부 서버에 배포했다면 예: const SERVER_URL = "https://your-service.onrender.com";
   *   (주소창에 ?api=http://192.168.0.10:8000 을 붙여 임시로 바꿀 수도 있음) */
  const SERVER_URL = "";
  const API_BASE = (PARAMS.get("api") || SERVER_URL || (location.protocol.startsWith("http") ? location.origin : "http://localhost:8000")).replace(/\/$/, "");

  const RADIO_PASSWORD = "토큰";
  const TEST_PASS_PENALTY_SEC = 600;   // ⚡ 테스트 패스 사용 시 기록에 더해지는 시간 (10분)

  const GAME_W = 1280, GAME_H = 720;
  const VIEW_H = 600;
  const SLOT_COUNT = 8;
  const INV = { SW: 132, SH: 94, GAP: 16 };
  /** 인벤토리 i번째 슬롯의 중심 좌표 (게임/UI 씬 공통 좌표계) */
  const slotCenter = (i) => ({
    x: (GAME_W - (SLOT_COUNT * INV.SW + (SLOT_COUNT - 1) * INV.GAP)) / 2 + INV.SW / 2 + i * (INV.SW + INV.GAP),
    y: VIEW_H + 58,
  });
  const FONT = 'system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", sans-serif';
  const EMOJI_FONT = '"Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", ' + FONT;
  const TEXT_RES = Math.min(window.devicePixelRatio || 1, 2);

  /* Kenney 우드/양피지 팔레트 */
  const C = {
    outline: 0x2b1d14,
    woodDark: 0x3e2410, woodShade: 0x6b4423, wood: 0x8b5a2b, woodLight: 0xa8743f,
    paperShade: 0xc9a874, paper: 0xf5e6c8, paperLight: 0xfdf6e3,
    ink: "#4a2c17", inkSoft: "#6b5440", cream: "#fdf2d8",
  };

  /* 아이템 정의 — 아이콘은 BootScene에서 icon_<id> 텍스처로 생성 */
  const ITEMS = {
    branch:       { name: "나뭇가지",       color: 0x8b5a2b, max: 10 },
    fish_metal:   { name: "물고기 쇳덩어리", color: 0x6b7280, max: 1 },
    magazine:     { name: "월간 피싱",       color: 0x2563eb, max: 1 },
    lighter:      { name: "라이터",          color: 0xdc2626, max: 1 },
    pot_empty:    { name: "빈 냄비",         color: 0x64748b, max: 1 },
    pot_water:    { name: "물 찬 냄비",      color: 0x0891b2, max: 1 },
    ramen_raw:    { name: "봉지 라면",       color: 0xea580c, max: 1 },
    ramen_cooked: { name: "완성된 라면",     color: 0xeab308, max: 1 },
    cutlery:      { name: "수저세트",        color: 0x94a3b8, max: 1 },
    recipe:       { name: "레시피",          color: 0xa16207, max: 1,
      onSelect: () => say(
        narr("📜 [무인도 라면 레시피] — 재훈"),
        narr("① 나뭇가지 10개를 화로에 쌓는다   ② 잡지를 찢어 불쏘시개로 넣는다"),
        narr("③ 라이터로 불을 붙인다   ④ 물 찬 냄비를 올린다   ⑤ 물이 끓으면 라면 투입!")
      ) },
  };

  /* =====================================================================
   *  1. 전역 게임 상태
   * ===================================================================== */
  const GameState = {
    playerName: "",
    startTime: 0,
    endTime: 0,
    inventory: [],
    selected: null,
    flags: {},
    busy: false,
    finished: false,
    sending: null,
    lastResult: null,
    events: null,
    penaltySec: 0,          // 테스트 패스 등 벌점 시간
    get elapsedSec() {
      if (!this.startTime) return 0;
      return Math.floor(((this.endTime || Date.now()) - this.startTime) / 1000) + this.penaltySec;
    },
  };

  /* =====================================================================
   *  2. 인벤토리 API
   * ===================================================================== */
  const Inventory = {
    get items() { return GameState.inventory; },
    get selected() { return GameState.selected; },
    count(id) { const it = this.items.find((i) => i.id === id); return it ? it.count : 0; },
    has(id, n = 1) { return this.count(id) >= n; },
    canAdd(id, n = 1) {
      const it = this.items.find((i) => i.id === id);
      if (!it) return this.items.length < SLOT_COUNT;
      return it.count + n <= ITEMS[id].max;
    },
    add(id, n = 1, opts = {}) {
      const def = ITEMS[id];
      if (!def) throw new Error("Unknown item: " + id);
      let it = this.items.find((i) => i.id === id);
      if (!it) {
        if (this.items.length >= SLOT_COUNT) { toast("인벤토리가 가득 찼습니다"); return 0; }
        it = { id, count: 0 };
        this.items.push(it);
      }
      const added = Math.min(n, def.max - it.count);
      if (added > 0) {
        it.count += added;
        GameState.events.emit("inventory-changed", { id, delta: added, quiet: !!opts.quiet });
      }
      return added;
    },
    remove(id, n = 1) {
      const idx = this.items.findIndex((i) => i.id === id);
      if (idx < 0) return 0;
      const it = this.items[idx];
      const removed = Math.min(n, it.count);
      it.count -= removed;
      if (it.count <= 0) {
        this.items.splice(idx, 1);
        if (GameState.selected === id) GameState.selected = null;
      }
      GameState.events.emit("inventory-changed", { id, delta: -removed });
      return removed;
    },
    replace(fromId, toId) {
      const it = this.items.find((i) => i.id === fromId);
      if (!it) return false;
      it.id = toId; it.count = 1;
      if (GameState.selected === fromId) GameState.selected = toId;
      GameState.events.emit("inventory-changed", { id: toId, delta: 1 });
      return true;
    },
    select(id) {
      GameState.selected = id && this.has(id) ? id : null;
      GameState.events.emit("selection-changed", GameState.selected);
    },
  };

  /* =====================================================================
   *  3. 대사 / UI 이벤트 헬퍼
   * ===================================================================== */
  function say(...lines) {
    GameState.events.emit("say", lines.map((l) =>
      typeof l === "string" ? { speaker: GameState.playerName, text: l } : l));
  }
  const line = (speaker, text) => ({ speaker, text });
  const narr = (text) => ({ speaker: "", text });
  const toast = (msg) => GameState.events && GameState.events.emit("toast", msg);
  const setBackButton = (handler) => GameState.events.emit("set-back", handler || null);
  const showChoice = (opts) => GameState.events.emit("choice", opts);
  const showEnding = (opts) => GameState.events.emit("ending", opts);
  const setQuest = (text) => GameState.events.emit("quest", text || null);

  function josa(word, pair) {
    const [withB, withoutB] = pair.split("/");
    const code = word.charCodeAt(word.length - 1);
    if (code < 0xac00 || code > 0xd7a3) return word + withoutB;
    return word + ((code - 0xac00) % 28 ? withB : withoutB);
  }

  function textStyle(extra = {}) {
    return { fontFamily: FONT, fontSize: "20px", color: "#ffffff", resolution: TEXT_RES, ...extra };
  }
  const fmtTime = (sec) => `${String(Math.floor(sec / 60)).padStart(2, "0")}:${String(sec % 60).padStart(2, "0")}`;

  /* =====================================================================
   *  4. 서버 전송
   * ===================================================================== */
  const ApiClient = {
    async sendResult(resultType, solvedQuiz = false) {
      if (GameState.lastResult) return GameState.lastResult;
      if (GameState.sending) return GameState.sending;
      if (!GameState.endTime) GameState.endTime = Date.now();
      GameState.finished = true;

      const payload = {
        player_name: GameState.playerName,
        result_type: resultType,
        play_time_sec: Math.floor(GameState.elapsedSec),
        solved_quiz: !!solvedQuiz,
      };
      GameState.sending = (async () => {
        for (let attempt = 1; attempt <= 3; attempt++) {
          try {
            const res = await fetch(`${API_BASE}/api/game/record`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });
            if (!res.ok) throw new Error("HTTP " + res.status);
            GameState.lastResult = await res.json();
            console.log("서버 기록 완료:", GameState.lastResult);
            return GameState.lastResult;
          } catch (e) {
            console.error(`서버 기록 실패 (${attempt}/3):`, e);
            await new Promise((r) => setTimeout(r, 800 * attempt));
          }
        }
        return null;
      })();
      const result = await GameState.sending;
      GameState.sending = null;
      return result;
    },
  };

  /* =====================================================================
   *  5. Kenney 스타일 UI 그리기 헬퍼 (우드 패널 · 양피지 · 3D 버튼)
   * ===================================================================== */
  function drawWood(g, x, y, w, h, r = 12) {
    g.fillStyle(C.woodDark, 1).fillRoundedRect(x - 3, y - 3, w + 6, h + 6, r + 3);
    g.fillStyle(C.woodShade, 1).fillRoundedRect(x, y, w, h, r);
    g.fillStyle(C.wood, 1).fillRoundedRect(x, y, w, h - 5, r);
    g.fillStyle(C.woodLight, 1).fillRoundedRect(x + 6, y + 4, w - 12, Math.max(4, h * 0.26), Math.min(r, 6));
    g.lineStyle(2, C.woodShade, 0.55).lineBetween(x + 14, y + h * 0.62, x + w - 14, y + h * 0.62);
  }

  function drawParchment(g, x, y, w, h, r = 20) {
    g.fillStyle(C.woodDark, 1).fillRoundedRect(x - 4, y - 4, w + 8, h + 8, r + 4);
    g.fillStyle(C.wood, 1).fillRoundedRect(x, y, w, h, r);
    g.fillStyle(C.woodLight, 1).fillRoundedRect(x + 8, y + 3, w - 16, 7, 4);
    g.fillStyle(C.paperShade, 1).fillRoundedRect(x + 10, y + 10, w - 20, h - 20, Math.max(4, r - 8));

  const BTN = {
    yellow: { face: 0xffc53d, light: 0xffe08a, shade: 0xc98a12, text: "#4a2c17", stroke: null },
    green:  { face: 0x7cc24a, light: 0xa6e07a, shade: 0x4d8a2a, text: "#ffffff", stroke: "#2d5a17" },
    red:    { face: 0xe0533d, light: 0xf28b7a, shade: 0x9c2f22, text: "#ffffff", stroke: "#6b1d14" },
    wood:   { face: 0x8b5a2b, light: 0xb07a44, shade: 0x5a381c, text: "#fdf2d8", stroke: "#3e2410" },

  /** 3D 버튼: 누르면 앞면이 아래로 쑥 들어가고, 손을 떼면 실행 */
  function make3DButton(scene, x, y, w, h, label, kind, onClick, fontSize = 22) {
    const P = BTN[kind] || BTN.yellow, D = 6;
    const c = scene.add.container(x, y);
    const base = scene.add.graphics();
    base.fillStyle(C.outline, 1).fillRoundedRect(-w / 2 - 3, -h / 2 - 3, w + 6, h + D + 6, 15);
    base.fillStyle(P.shade, 1).fillRoundedRect(-w / 2, -h / 2 + D, w, h, 12);
    const face = scene.add.container(0, 0);
    const fg = scene.add.graphics();
    fg.fillStyle(P.face, 1).fillRoundedRect(-w / 2, -h / 2, w, h, 12);
    fg.fillStyle(P.light, 1).fillRoundedRect(-w / 2 + 6, -h / 2 + 4, w - 12, h * 0.34, 8);
    const txt = scene.add.text(0, 1, label, textStyle({
      fontSize: fontSize + "px", fontStyle: "bold", color: P.text,
      ...(P.stroke ? { stroke: P.stroke, strokeThickness: 4 } : {}),
    })).setOrigin(0.5);
    face.add([fg, txt]);
    const zone = scene.add.zone(0, D / 2, w + 6, h + D + 6).setInteractive({ useHandCursor: true });
    c.add([base, face, zone]);
    let pressed = false;
    const press = (p) => { pressed = p; face.y = p ? D - 2 : 0; };
    zone.on("pointerdown", () => { if (!c.disabled) press(true); });
    zone.on("pointerout", () => press(false));
    zone.on("pointerup", () => {
      if (!pressed) return;
      press(false);
      if (!c.disabled && onClick) onClick();
    });
    c.label = txt;
    return c;
  }

  /* =====================================================================
   *  6. 벡터 아이콘 (128×128 텍스처) — 두꺼운 외곽선 + 2단 음영
   * ===================================================================== */
  const OW = 6;
  const K = {
    rr(g, x, y, w, h, r, fill, ow = OW) { g.fillStyle(fill, 1).fillRoundedRect(x, y, w, h, r); if (ow) g.lineStyle(ow, C.outline, 1).strokeRoundedRect(x, y, w, h, r); },
    el(g, x, y, w, h, fill, ow = OW) { g.fillStyle(fill, 1).fillEllipse(x, y, w, h); if (ow) g.lineStyle(ow, C.outline, 1).strokeEllipse(x, y, w, h); },
    ci(g, x, y, r, fill, ow = OW) { g.fillStyle(fill, 1).fillCircle(x, y, r); if (ow) g.lineStyle(ow, C.outline, 1).strokeCircle(x, y, r); },
    po(g, pts, fill, ow = OW) { g.fillStyle(fill, 1).fillPoints(pts, true); if (ow) g.lineStyle(ow, C.outline, 1).strokePoints(pts, true, true); },
    /** 둥근 끝 막대 (외곽선 먼저 → 색) */
    stickOutline(g, x1, y1, x2, y2, w) {
      g.lineStyle(w + OW * 2, C.outline, 1).lineBetween(x1, y1, x2, y2);
      g.fillStyle(C.outline, 1).fillCircle(x1, y1, w / 2 + OW).fillCircle(x2, y2, w / 2 + OW);
    },
    stickFill(g, x1, y1, x2, y2, w, col) {
      g.lineStyle(w, col, 1).lineBetween(x1, y1, x2, y2);
      g.fillStyle(col, 1).fillCircle(x1, y1, w / 2).fillCircle(x2, y2, w / 2);
    },
    wave(g, x1, x2, y, amp, col, w) {
      const pts = [];
      for (let x = x1; x <= x2; x += 4) pts.push({ x, y: y + Math.sin((x - x1) / 5) * amp });
      g.lineStyle(w, col, 1).strokePoints(pts);
    },
  };

      g.fillStyle(C.outline, 1).fillCircle(52, 37, 3.5).fillCircle(80, 37, 3.5);
      g.lineStyle(4, C.outline, 1).beginPath().arc(64, 82, 9, 0.3, Math.PI - 0.3).strokePath();
    },
  };

  /** 바닥 아이템 그래픽 (은은한 빛 + 아이콘) */
  function makeItemSprite(scene, id, size = 68, plain = false) {
    if (id === "branch") return makeBranchSprite(scene);
    const c = scene.add.container(0, 0);
    if (plain) {                                   // 배낭 속처럼 다른 물건과 섞여 있을 때: 후광·반짝임 없이 그림자만
      c.add([scene.add.ellipse(4, size * 0.36, size * 0.8, size * 0.2, 0x000000, 0.3), scene.add.image(0, 0, "icon_" + id).setDisplaySize(size, size)]);
      return c;
    }
    const glow = scene.add.circle(0, 2, size * 0.5, 0xfff3b0, 0.22);
    scene.tweens.add({ targets: glow, scale: 1.18, alpha: 0.1, duration: 900, yoyo: true, repeat: -1 });
    const img = scene.add.image(0, 0, "icon_" + id).setDisplaySize(size, size);
    const spark = scene.add.text(size * 0.42, -size * 0.42, "✦", textStyle({ fontSize: "18px", color: "#fff7c2" })).setOrigin(0.5);
    scene.tweens.add({ targets: spark, alpha: 0.1, scale: 0.6, duration: 800, yoyo: true, repeat: -1, delay: Phaser.Math.Between(0, 600) });
    c.add([glow, img, spark]);
    return c;
  }

  /** 씬에 놓인 나뭇가지 (그림자 포함) */
  function makeBranchSprite(scene, shadow = true, forkUp = false) {
    const c = scene.add.container(0, 0);
    if (shadow) c.add(scene.add.ellipse(0, 12, 100, 14, 0x000000, 0.15));
    // forkUp: 곁가지·잎이 위로 삐죽 솟게 (모래·바위 틈에 박힌 느낌)
    c.add(scene.add.image(0, 0, "icon_branch").setDisplaySize(84, 84).setAngle(forkUp ? 218 : 38));
    const spark = scene.add.text(4, -24, "✦", textStyle({ fontSize: "17px", color: "#fff7c2" })).setOrigin(0.5);
    scene.tweens.add({ targets: spark, alpha: 0.1, scale: 0.6, duration: 800, yoyo: true, repeat: -1, delay: Phaser.Math.Between(0, 600) });
    c.add(spark);
    return c;
  }

  /** 떡갈나무 줄기 마디에서 뻗어 나온 잔가지 (원점 = 줄기에 붙은 지점) */
  function makeTwigSprite(scene, { tip, fork, leaves }) {
    const c = scene.add.container(0, 0);
    const g = scene.add.graphics();
    K.stickOutline(g, 0, 0, tip[0], tip[1], 9);
    K.stickOutline(g, fork[0][0], fork[0][1], fork[1][0], fork[1][1], 5);
    K.stickFill(g, 0, 0, tip[0], tip[1], 9, 0x8d6748);
    K.stickFill(g, fork[0][0], fork[0][1], fork[1][0], fork[1][1], 5, 0x8d6748);
    g.lineStyle(3, 0xb08a64, 1).lineBetween(tip[0] * 0.15, tip[1] * 0.15 - 2, tip[0] * 0.85, tip[1] * 0.85 - 2);
    leaves.forEach(([x, y, a]) => {
      g.save(); g.translateCanvas(x, y); g.rotateCanvas(a);
      g.fillStyle(C.outline, 1).fillEllipse(0, 0, 28, 15);
      g.fillStyle(0x5aa832, 1).fillEllipse(0, 0, 23, 11);
      g.fillStyle(0x9bd65f, 1).fillEllipse(-3, -2, 10, 4);
      g.restore();
    });
    const spark = scene.add.text(tip[0], tip[1] - 16, "✦", textStyle({ fontSize: "17px", color: "#fff7c2" })).setOrigin(0.5);
    scene.tweens.add({ targets: spark, alpha: 0.1, scale: 0.6, duration: 800, yoyo: true, repeat: -1, delay: Phaser.Math.Between(0, 600) });
    c.add([g, spark]);
    return c;
  }

  /** 해변 모래잡초 한 무더기 */
  function drawBeachGrass(g, x, y, s, front) {
    const dark = front ? 0x6f9a35 : 0x55782a, light = front ? 0xa3c95c : 0x7ea43e;
    [[-14, -24, -10], [-7, -34, -3], [0, -28, 5], [6, -40, 13], [13, -22, 22]].forEach(([bx, h, tip], i) => {
      g.fillStyle(C.outline, 0.9).fillTriangle(x + (bx - 5) * s, y + 1, x + tip * s, y + (h - 3) * s, x + (bx + 5) * s, y + 1);
      g.fillStyle(i % 2 ? light : dark, 1).fillTriangle(x + (bx - 3.5) * s, y, x + tip * s, y + h * s, x + (bx + 3.5) * s, y);
    });
  }

  /** 물기 먹은 바위 (외곽선 · 젖은 광택 · 이끼) */
  function drawWetRock(g, x, y, w, h, moss = true) {
    g.fillStyle(C.outline, 1).fillEllipse(x, y, w + 7, h + 7);
    g.fillStyle(0x433831, 1).fillEllipse(x, y + 2, w, h);
    g.fillStyle(0x64574c, 1).fillEllipse(x - w * 0.06, y - h * 0.08, w * 0.84, h * 0.72);
    g.fillStyle(0xcff3fa, 0.6).fillEllipse(x - w * 0.2, y - h * 0.24, w * 0.36, h * 0.13);
    if (moss) {
      g.fillStyle(0x4f7f30, 1).fillEllipse(x + w * 0.12, y - h * 0.36, w * 0.56, h * 0.26);
      g.fillStyle(0x86b84a, 1).fillEllipse(x + w * 0.06, y - h * 0.42, w * 0.3, h * 0.11);
    }
  }

  /**
   * 나뭇가지를 지형에 자연스럽게 파묻기
   * - 뒤 레이어(depth 9): 접지 그림자 · 둔덕/바위 · 뒤쪽 풀
   * - 앞 레이어(depth 12): 가지 끝을 덮는 풀/모래/자갈 → 나뭇가지(depth 10)가 그 사이에 끼어 보임
   * 가지를 주운 뒤에도 지형 장식은 그대로 남는다.
   */
  function nestBranch(scene, x, y, angle, style) {
    const rad = Phaser.Math.DegToRad(angle);
    const ex = Math.cos(rad) * 38, ey = Math.sin(rad) * 38;
    const L = { x: x - ex, y: y - ey + 4 }, R = { x: x + ex, y: y + ey + 4 };
    const back = scene.add.graphics().setDepth(9);
    const front = scene.add.graphics().setDepth(12);
    if (style === "sand") {
      back.fillStyle(0x000000, 0.13).fillEllipse(x + 2, y + 9, 100, 14);
      back.fillStyle(0xe3c48a, 1).fillEllipse(L.x + 4, L.y + 4, 78, 24);           // 모래 둔덕
      back.fillStyle(0xf1d9a5, 1).fillEllipse(L.x + 1, L.y, 62, 15);
      drawBeachGrass(back, L.x - 10, L.y + 6, 0.95, false);
      drawBeachGrass(front, L.x + 6, L.y + 12, 1.05, true);                          // 왼쪽 끝은 풀숲에 가려짐
      front.fillStyle(0xd9b878, 1).fillEllipse(R.x + 4, R.y + 4, 46, 20);            // 오른쪽 끝은 모래에 묻힘
      front.fillStyle(0xf0d6a0, 1).fillEllipse(R.x + 2, R.y + 1, 40, 14);
      front.fillStyle(0xfaecd0, 1).fillEllipse(R.x - 3, R.y - 2, 18, 5);
      front.fillStyle(0xc9a76a, 1).fillCircle(R.x + 16, R.y + 6, 2).fillCircle(R.x - 10, R.y + 7, 1.5);
    } else if (style === "wet") {
      back.fillStyle(0x000000, 0.25).fillEllipse(x + 4, y + 11, 118, 18);
      back.fillStyle(0x5b4e43, 1).fillEllipse(x, y + 10, 128, 22);                  // 젖어서 어두워진 바닥
      drawWetRock(back, R.x + 16, R.y - 12, 54, 40);                                  // 가지가 기댄 뒤쪽 바위
      drawWetRock(back, L.x - 20, L.y - 6, 38, 28);
      drawWetRock(front, L.x + 8, L.y + 12, 34, 22);                                  // 가지 끝을 누르는 앞쪽 돌
      [[R.x - 4, R.y + 12, 8], [R.x + 10, R.y + 14, 6], [x - 6, y + 15, 5], [L.x + 30, L.y + 14, 5]].forEach(([px, py, r]) => {
        front.fillStyle(C.outline, 1).fillCircle(px, py, r + 2);
        front.fillStyle(0x8a8079, 1).fillCircle(px, py, r);
        front.fillStyle(0xd7f4fa, 0.7).fillCircle(px - r * 0.35, py - r * 0.35, r * 0.3);
      });
      front.fillStyle(0x6fa83f, 1).fillEllipse(L.x + 4, L.y + 3, 26, 9);              // 이끼가 가지 끝을 덮음
      front.fillStyle(0x9cd060, 1).fillEllipse(L.x, L.y + 1, 12, 4);
      const drip = scene.add.circle(R.x + 18, R.y - 30, 2.5, 0xe0f7ff, 0.95).setDepth(12);
      scene.tweens.add({ targets: drip, y: R.y - 4, alpha: 0, duration: 900, repeat: -1, repeatDelay: Phaser.Math.Between(600, 1400) });
    }
  }

  /* =====================================================================
   *  7. 부트 씬 — 아이콘 텍스처 생성 후 게임 시작
   * ===================================================================== */
  class BootScene extends Phaser.Scene {
    constructor() { super("BootScene"); }
    create() {
      Object.entries(ICON_PAINTERS).forEach(([key, paint]) => {
        const g = this.make.graphics({ x: 0, y: 0 }, false);
        paint(g);
        g.generateTexture(key, 128, 128);
        g.destroy();
      });
      this.scene.launch("UIScene");
      this.scene.start("IslandScene");
    }
  }

  /* =====================================================================
   *  8. 베이스 씬 — 핫스팟 / 루팅 / 더미 / 전환 / 연출 공통 기능
   * ===================================================================== */
  class BaseScene extends Phaser.Scene {
    initBase() {
      this.transitioning = false;
      this.input.on("pointerdown", (p) => { if (p.y < VIEW_H) this.ripple(p.x, p.y); });
      this.scene.bringToTop("UIScene");
      this.cameras.main.fadeIn(180, 42, 26, 14);
    }

    addHotspot(h) {
      const zone = this.add.zone(h.x, h.y, h.w, h.h).setInteractive({ useHandCursor: true });
      zone.on("pointerdown", () => this.handleHotspot(h));
      if (DEBUG) this.add.rectangle(h.x, h.y, h.w, h.h).setStrokeStyle(2, 0xff0055).setDepth(90);
      h.zone = zone;
      return h;
    }

    handleHotspot(h) {
      if (GameState.busy || this.transitioning) return;
      if (h.flash !== false) this.flash(h.x, h.y, h.w, h.h);
      const sel = Inventory.selected;
      if (sel && !h.ignoreSelection) {
        const used = h.onUse && h.onUse(sel);
        if (!used) say(`${josa(ITEMS[sel].name, "은/는")} 여기에 쓸 수 없을 것 같다.`);
        if (Inventory.selected) Inventory.select(null);
        return;
      }
      if (h.onTap) h.onTap();
    }

    /** 바닥 아이템 (터치하면 인벤토리로) — flag로 재수집 방지 */
    addLoot({ flag, item, count = 1, x, y, w = 110, h = 100, angle = 0, sprite, size, plain, depth = 10, hit, msg, onTake }) {
      if (GameState.flags[flag]) return null;
      const def = ITEMS[item];
      const made = typeof sprite === "function" ? sprite() : sprite;   // 이미 주운 경우 그래픽을 만들지 않도록 함수로 받음
      const c = (made || makeItemSprite(this, item, size, plain)).setPosition(x, y).setAngle(angle).setDepth(depth);
      const hz = hit || { x, y, w, h };
      const zone = this.add.zone(hz.x, hz.y, hz.w, hz.h).setInteractive({ useHandCursor: true }).setDepth(depth + 1);
      if (DEBUG) this.add.rectangle(hz.x, hz.y, hz.w, hz.h).setStrokeStyle(2, 0x00ff99).setDepth(90);

      zone.on("pointerdown", () => {
        if (GameState.busy || this.transitioning || GameState.flags[flag]) return;
        if (!Inventory.canAdd(item, count)) {
          if (Inventory.items.find((i) => i.id === item)) say(`${josa(def.name, "은/는")} 더 이상 들 수 없다.`);
          else toast("인벤토리가 가득 찼습니다");
          return;
        }
        GameState.flags[flag] = true;
        zone.destroy();
        if (Inventory.selected) Inventory.select(null);
        Inventory.add(item, count, { quiet: true });
        this.flyToInventory(c, item);
        toast(def.max > 1
          ? `✨ ${def.name} +${count}  (${Inventory.count(item)}/${def.max})`
          : `✨ ${def.name} 획득!`);
        if (onTake) onTake();
        if (item === "branch" && Inventory.count("branch") === ITEMS.branch.max) {
          say("나뭇가지 10개를 전부 모았다! 이제 화로에 불을 피울 수 있겠어.");
        } else if (msg) {
          say(...[].concat(msg));
        }
      });
      return { container: c, zone };
    }

    /** 줍기 연출: 살짝 솟아올라 튕긴 뒤 → 해당 인벤토리 슬롯으로 쏙 빨려 들어감 */
    flyToInventory(c, item) {
      const idx = GameState.inventory.findIndex((i) => i.id === item);
      const dest = slotCenter(Math.max(0, idx));
      this.tweens.killTweensOf(c);
      c.setDepth(300);
      const s = c.scaleX || 1;
      this.tweens.add({
        targets: c, y: c.y - 46, angle: 0, scaleX: s * 1.18, scaleY: s * 1.18, duration: 230, ease: "Back.easeOut",
        onComplete: () => this.tweens.add({
          targets: c, x: dest.x, y: dest.y - 8, scaleX: s * 0.42, scaleY: s * 0.42, duration: 420, delay: 80, ease: "Cubic.easeIn",
          onComplete: () => { GameState.events.emit("slot-bump", item); this.destroyDeep(c); },
        }),
      });
    }

    /** 더미 오브젝트 (인벤토리에 들어가지 않고 대사만 출력) */
    addDummy({ tex, x, y, size = 80, angle = 0, depth = 9, msg, onTap }) {
      // 투명한 모서리가 다른 물건 터치를 가로채지 않도록 가운데 66%만 터치 영역으로
      const img = this.add.image(x, y, tex).setDisplaySize(size, size).setAngle(angle).setDepth(depth)
        .setInteractive({ hitArea: new Phaser.Geom.Rectangle(22, 22, 84, 84), hitAreaCallback: Phaser.Geom.Rectangle.Contains, useHandCursor: true });
      if (DEBUG) this.add.rectangle(x, y, size * 0.66, size * 0.66).setStrokeStyle(2, 0x60a5fa).setDepth(90).setAngle(angle);
      img.on("pointerdown", () => {
        if (GameState.busy || this.transitioning) return;
        if (Inventory.selected) Inventory.select(null);
        if (onTap) { onTap(img); return; }
        this.tweens.add({ targets: img, angle: angle + 8, duration: 70, yoyo: true, repeat: 1, onComplete: () => img.setAngle(angle) });
        say(msg);
      });
      return img;
    }

    goTo(key) {
      if (this.transitioning || GameState.busy) return;
      this.transitioning = true;
      this.cameras.main.fadeOut(160, 42, 26, 14);
      this.cameras.main.once("camerafadeoutcomplete", () => this.scene.start(key));
    }

    destroyDeep(obj) {
      if (obj.list) obj.list.forEach((ch) => this.tweens.killTweensOf(ch));
      this.tweens.killTweensOf(obj);
      obj.destroy();
    }

    addLabel(x, y, text) {
      return this.add.text(x, y, text, textStyle({
        fontSize: "15px", fontStyle: "bold", color: C.cream, backgroundColor: "#6b4423", padding: { x: 10, y: 4 },
      })).setOrigin(0.5, 0).setDepth(5);
    }

    flash(x, y, w, h) {
      const g = this.add.graphics().setDepth(80);
      g.lineStyle(5, 0xffd34d, 1).strokeRoundedRect(x - w / 2, y - h / 2, w, h, 14);
      this.tweens.add({ targets: g, alpha: 0, duration: 420, onComplete: () => g.destroy() });
    }

    ripple(x, y) {
      const c = this.add.circle(x, y, 8).setStrokeStyle(4, 0xfff3c4, 0.95).setDepth(100);
      this.tweens.add({ targets: c, radius: 34, alpha: 0, duration: 380, ease: "Cubic.easeOut", onComplete: () => c.destroy() });
    }
  }

  /** 클로즈업 공통: 상단 우드 간판 제목 + 뒤로가기 버튼 */
  class CloseupScene extends BaseScene {
    constructor(key, title) { super(key); this.title = title; }

    create() {
      GameState.events.emit("hide-dialogue");     // 섬에서 띄운 [조사] 독백은 클로즈업 진입 시 정리
      this.initBase();
      this.drawScene();
      const t = this.add.text(GAME_W / 2, 37, this.title, textStyle({
        fontSize: "22px", fontStyle: "bold", color: C.cream, stroke: "#3e2410", strokeThickness: 4,
      })).setOrigin(0.5).setDepth(41);
      const w = t.width + 56;
      const sg = this.add.graphics().setDepth(40);
      drawWood(sg, GAME_W / 2 - w / 2, 14, w, 46, 12);
      sg.fillStyle(C.woodDark, 1).fillCircle(GAME_W / 2 - w / 2 + 13, 35, 3.5).fillCircle(GAME_W / 2 + w / 2 - 13, 35, 3.5);
      // 상단 대사창이 떠 있는 동안 제목 간판은 흐리게 (반투명 대사창 뒤로 글자가 겹쳐 보이지 않게)
      const onDialog = (shown) => this.tweens.add({ targets: [t, sg], alpha: shown ? 0 : 1, duration: 180 });
      GameState.events.on("dialog", onDialog);
      this.events.once("shutdown", () => GameState.events.off("dialog", onDialog));
      setBackButton(() => this.goTo(this.backTo || "IslandScene"));
    }

    drawScene() {}
  }

  /* =====================================================================
   *  9. 메인 무인도 씬
   * ===================================================================== */
  /** WebGL 렌더러에서만 postFX(Glow) 사용, Canvas면 후광만 */
  const isWebGL = (scene) => { try { return scene.sys.game.renderer.type === Phaser.WEBGL; } catch (e) { return false; } };

  /** 4갈래 별 반짝임 */
  function drawStar(g, s, color = 0xfffbe0) {
    g.fillStyle(color, 1).fillPoints([
      { x: 0, y: -s }, { x: s * 0.24, y: -s * 0.24 }, { x: s, y: 0 }, { x: s * 0.24, y: s * 0.24 },
      { x: 0, y: s }, { x: -s * 0.24, y: s * 0.24 }, { x: -s, y: 0 }, { x: -s * 0.24, y: -s * 0.24 },
    ], true);
  }

  class IslandScene extends BaseScene {
    constructor() { super("IslandScene"); }

    create() {
      this.initBase();
      const F = GameState.flags;
      this.shoreY = (x) => 354 + Math.sin(x / 90) * 8 + Math.sin(x / 37) * 3;

      this.drawSkyAndSea();
      this.drawBeach();
      this.objs = {
        rocks: this.drawLeftCliff(),
        waterfall: this.drawWaterfall(),
        tree: this.drawTree(),
        boat: this.drawBoat(),
        junk: this.drawJunk(),
        backpack: this.drawBackpack(),
        boss: this.drawBoss(!!F.bossAwake),
      };
      this.createHotspots();

      [{ flag: "sandBranch1", x: 582, y: 556, angle: -8 }, { flag: "sandBranch2", x: 1012, y: 548, angle: 12 }]
        .forEach((b) => {
          nestBranch(this, b.x, b.y, b.angle, "sand");
          this.addLoot({ ...b, item: "branch", w: 130, h: 70, sprite: () => makeBranchSprite(this, false, true), msg: "모래에 반쯤 묻혀 있던 나뭇가지다. 땔감으로 딱이겠어!" });
        });

      if (Inventory.has("ramen_cooked") && !F.bossAwake) this.addQuestMarker(300, 452);

      setBackButton(null);

      if (!F.introShown) {
        F.introShown = true;
        this.time.delayedCall(500, () => say(
          narr("…철썩, 철썩. 파도 소리에 눈을 떴다."),
          "여긴 어디지…? 분명 부장님들이랑 낚시 워크숍 가는 통통배에 타고 있었는데.",
          "일단 정신 차리자. 반짝이는 곳들을 조사해서… 오늘도 무사히 퇴근해야지!"
        ));
      }
    }

    /* ─────────────── 배경: 하늘 · 해 · 구름 · 바다 ─────────────── */
    drawSkyAndSea() {
      const g = this.add.graphics();
      g.fillGradientStyle(0x5bb8e6, 0x5bb8e6, 0xd4f1fb, 0xd4f1fb, 1).fillRect(0, 0, GAME_W, 252);
      g.fillStyle(0xfff6d5, 0.25).fillCircle(700, 168, 96);
      g.fillStyle(0xfff6d5, 0.45).fillCircle(700, 168, 66);
      g.fillStyle(0xfff1b8, 1).fillCircle(700, 168, 42);
      g.fillStyle(0xfffbe6, 1).fillCircle(688, 156, 14);

      // 먼 섬 실루엣
      g.fillStyle(0x93cbc6, 1).fillEllipse(150, 252, 300, 44).fillEllipse(1190, 252, 220, 32);

    createHotspots() {

      const SPOTS = [

          inspect: "바닷바람에 구불구불 휘어진 떡갈나무다. 자세히 살펴볼까?" },
        { key: "rocks", x: 440, y: 300, w: 260, h: 210, spark: [442, 300], scene: "CLOSEUP_ROCKS",
          inspect: "절벽 아래 돌무더기… 움푹한 벽면에 숯으로 뭔가 적혀 있는 것 같다. 가까이 가 볼까?" },

        { key: "backpack", x: 801, y: 448, w: 110, h: 116, spark: [801, 436], scene: "CLOSEUP_BAG",
          inspect: "모래 위에 버려진 등산 배낭이다. 누구 거지?" },
        { key: "waterfall", x: 950, y: 250, w: 200, h: 310, spark: [943, 240], scene: "CLOSEUP_WATERFALL",
          inspect: "절벽 틈에서 시원한 물줄기가 쏟아진다. 가까이 가 볼까?" },
        { key: "boat", x: 1170, y: 370, w: 210, h: 190, spark: [1190, 316], scene: "CLOSEUP_BOAT",
          inspect: "우리가 타고 온 통통배… 모래에 처박혀 버렸다. 안을 살펴보자." },
      ];
      this.spots = SPOTS.map((s) => {
        const h = this.addHotspot({ ...s, flash: false, ignoreSelection: true, onTap: () => this.inspect(h) });
        this.wireHover(h);
        this.addSparkle(s.spark[0], s.spark[1]);
        return h;
      });

      const bossAwake = !!F.bossAwake;
      const boss = this.addHotspot({
        key: "boss", flash: false,
        x: bossAwake ? 372 : 340, y: bossAwake ? 500 : 532, w: bossAwake ? 230 : 290, h: bossAwake ? 130 : 110,
        onTap: () => {
          this.pulse(boss);
          if (GameState.flags.bossAwake) {
            say(line("이영현 부장", `${GameState.playerName}사원! 무전기 비밀번호는 AI가 텍스트를 처리하는 기본 단위 이름이야. 어서!`));

    /** 퀘스트 안내 마커 (부장님 머리 위에서 통통 튀는 라면 말풍선) */
    addQuestMarker(x, y) {
      const m = this.add.container(x, y).setDepth(26);
      const g = this.add.graphics();
      g.fillStyle(C.outline, 1).fillRoundedRect(-36, -36, 72, 58, 16).fillTriangle(-12, 20, 12, 20, 0, 38);
      g.fillStyle(C.paper, 1).fillRoundedRect(-32, -32, 64, 50, 13).fillTriangle(-8, 16, 8, 16, 0, 31);
      g.fillStyle(0xffc53d, 1).fillRoundedRect(-32, -32, 64, 8, { tl: 13, tr: 13, bl: 0, br: 0 });
      m.add([g, this.add.image(0, -5, "icon_ramen_cooked").setDisplaySize(44, 44)]);
      this.tweens.add({ targets: m, y: y - 12, duration: 520, yoyo: true, repeat: -1, ease: "Sine.easeInOut" });
      return m;
    }

    /** 오브젝트 키 → 그려진 컨테이너 */
    targetOf(h) { return this.objs[h.key]; }

    wireHover(h) {
      // 은은한 후광 (Canvas/WebGL 공통)
      h.halo = this.add.ellipse(h.x, h.y + h.h * 0.08, h.w * 1.05, h.h * 0.95, 0xfff2b3, 1)
        .setAlpha(0).setBlendMode(Phaser.BlendModes.ADD).setDepth(1);
      h.zone.on("pointerover", () => this.setHighlight(h, true));
      h.zone.on("pointerout", () => { if (!this.transitioning) this.setHighlight(h, false); });
    }

    setHighlight(h, on) {
      if (h.lit === on) return;
      h.lit = on;
      this.tweens.killTweensOf(h.halo);
      this.tweens.add({ targets: h.halo, alpha: on ? 0.22 : 0, duration: 180 });
      const obj = this.targetOf(h);
      if (!obj || !isWebGL(this) || !obj.postFX) return;
      try {
        if (on && !h.glowFx) {
          h.glowFx = obj.postFX.addGlow(0xfff2b3, 0, 0, false, 0.1, 14);
          this.tweens.add({ targets: h.glowFx, outerStrength: 5, duration: 180 });
        } else if (!on && h.glowFx) {
          obj.postFX.remove(h.glowFx);
          h.glowFx = null;
        }
      } catch (e) { /* 일부 기기에서 FX 미지원 → 후광만 사용 */ }
    }

    pulse(h) {
      this.setHighlight(h, true);
      this.time.delayedCall(650, () => this.setHighlight(h, false));
    }

    /** [조사] 독백 → 잠시 후 클로즈업 전환 */
    inspect(h) {
      if (this.transitioning || GameState.busy) return;
      this.transitioning = true;
      this.setHighlight(h, true);
      say(line(GameState.playerName, `[조사] ${h.inspect}`));
      this.time.delayedCall(1100, () => {
        this.cameras.main.fadeOut(220, 42, 26, 14);
        this.cameras.main.once("camerafadeoutcomplete", () => this.scene.start(h.scene));
      });
    }

    /** 2~3초 간격으로 은은하게 깜빡이는 별 반짝임 */
    addSparkle(x, y) {
      const spawn = () => {
        const s = this.add.graphics().setPosition(x + Phaser.Math.Between(-10, 10), y + Phaser.Math.Between(-10, 10)).setDepth(30).setScale(0).setAlpha(0);
        s.fillStyle(0xfff3b0, 0.35).fillCircle(0, 0, 12);
        drawStar(s, 11);
        s.fillStyle(0xffffff, 1).fillCircle(0, 0, 2.5);
        this.tweens.add({
          targets: s, scale: 1, alpha: 1, angle: 90, duration: 420, yoyo: true, hold: 200, ease: "Sine.easeOut",
          onComplete: () => s.destroy(),
        });
      };
      this.time.delayedCall(Phaser.Math.Between(200, 1800), () => {
        spawn();
        this.time.addEvent({ delay: Phaser.Math.Between(2000, 3000), loop: true, callback: spawn });
      });
    }

    openRamenChoice() {
      const name = GameState.playerName;
      showChoice({
        title: "🍜 김이 모락모락 나는 라면… 어떻게 할까?",
        options: [
          {
            label: "🤝 이영현 부장님을 깨워서 함께 먹는다", style: "green",
            onSelect: () => {
              setQuest(null);
              Inventory.remove("ramen_cooked");
              Inventory.select(null);
              GameState.flags.bossAwake = true;
              GameState.flags.radioUnlocked = true;
              this.scene.restart();
              say(
                narr("후루룩… 라면 냄새에 부장님이 번쩍 눈을 떴다!"),
                line("이영현 부장", `${name}사원 고마워! 선장님이 요즘 AI공부를 하고 계신데, AI가 텍스트를 처리하는 기본 단위 이름을 비밀번호로 썼다고 했어!! 어서 무전기에 넣어봐!`)
              );
            },
          },
          {
            label: "😋 식량이 없는데... 나 혼자 먹는다", style: "red",
            onSelect: () => {
              Inventory.remove("ramen_cooked");
              Inventory.select(null);
              GameState.busy = true;
              GameState.endTime = Date.now();
              say(narr("후루룩… 쩝쩝. 혼자 라면을 다 먹었지만... 더 이상 탈출할 방법을 찾지 못했다."));
              this.cameras.main.fadeOut(2200, 20, 6, 8);
              this.time.delayedCall(2400, () => showEnding({
                type: "FAILED",
                emoji: "💀🍜",
                title: "퇴근 실패 (BAD END)",
                message: "💀 퇴근하기 실패...\n혼자 라면을 다 먹었지만 섬을 탈출하지 못했습니다.",
                solvedQuiz: false,
              }));
            },
          },
        ],
      });
    }
  }

  /* =====================================================================
   *  10-① 클로즈업: 떡갈나무

  class TreeScene extends CloseupScene {
    constructor() { super("CLOSEUP_TREE", "🌳 떡갈나무"); }

    drawScene() {
      const g = this.add.graphics();
      g.fillGradientStyle(0x1b4332, 0x1b4332, 0x2d6a4f, 0x2d6a4f, 1).fillRect(0, 0, GAME_W, VIEW_H);

      [[60, 30, 60], [330, 10, 70], [980, 20, 80], [1220, 90, 50]].forEach(([x, y, r]) => g.fillCircle(x, y, r));
      g.fillStyle(0xe9c46a, 1).fillRect(0, 470, GAME_W, 130);

      [600, 635, 670, 705].forEach((x, i) => {
        const pts = [];
        for (let y = 0; y <= 470; y += 30) pts.push({ x: x + Math.sin(y / 40 + i) * 6 + (y / 470) * (i - 1.5) * 12, y });

      });
      g.fillStyle(0x3e2712, 1).fillEllipse(640, 300, 34, 50);
      g.fillStyle(0x5b3a1e, 1).fillTriangle(530, 480, 470, 490, 560, 440).fillTriangle(770, 480, 840, 492, 740, 440);

      // 잔가지가 돋아난 줄기 마디 (가지를 꺾어도 부러진 그루터기가 남음)
      this.TWIGS.forEach(({ at, tip }) => {
        const [ax, ay] = at, len = Math.hypot(tip[0], tip[1]);
        const sx = ax + (tip[0] / len) * 16, sy = ay + (tip[1] / len) * 16;
        g.fillStyle(C.outline, 1).fillEllipse(ax, ay, 36, 30);
        g.fillStyle(0x4a2f17, 1).fillEllipse(ax, ay, 30, 24);
        g.fillStyle(0x6b4423, 1).fillEllipse(ax - 2, ay - 3, 20, 14);
        K.stickOutline(g, ax, ay, sx, sy, 10);
        K.stickFill(g, ax, ay, sx, sy, 10, 0x7a5232);
        g.fillStyle(0xd9b48a, 1).fillCircle(sx, sy, 4);                  // 꺾인 단면
      });

      this.addHotspot({
        name: "줄기", x: 650, y: 240, w: 190, h: 460,
        onTap: () => say(GameState.flags.treeTwig1 && GameState.flags.treeTwig2
          ? "잔가지를 다 꺾었다. 이제 더 얻을 건 없겠어."
          : "수백 년은 된 것 같은 떡갈나무다. 줄기에 붙은 잔가지를 꺾을 수 있겠어."),
      });

      const twigMsg = () => (GameState.flags.treeTwig1 && GameState.flags.treeTwig2) ? "잔가지 두 개를 모두 꺾었다!" : "똑! 줄기에서 잔가지를 꺾었다.";
      this.TWIGS.forEach((t) => this.addLoot({
        flag: t.flag, item: "branch", x: t.at[0], y: t.at[1],
        hit: { x: t.at[0] + t.tip[0] * 0.55, y: t.at[1] + t.tip[1] * 0.55, w: 130, h: 96 },
        sprite: () => makeTwigSprite(this, t), onTake: () => say(twigMsg()),
      }));
    }

  /* =====================================================================
   *  10-② 클로즈업: 돌무더기 (퇴근 시간 시계 퍼즐)
   * ===================================================================== */
  class RocksScene extends CloseupScene {
    constructor() { super("CLOSEUP_ROCKS", "🪨 돌무더기"); }

    drawScene() {
      const F = GameState.flags;
      const g = this.add.graphics();
      g.fillGradientStyle(0x2b2420, 0x2b2420, 0x4a3f35, 0x4a3f35, 1).fillRect(0, 0, GAME_W, VIEW_H);
      g.fillStyle(0x3d342c, 0.8);
      [[120, 80, 180, 90], [520, 60, 220, 80], [1150, 90, 200, 120], [90, 330, 140, 100]].forEach(([x, y, w, h]) => g.fillEllipse(x, y, w, h));
      g.fillStyle(0x6b5b4b, 1).fillRect(0, 468, GAME_W, 132);
      g.fillStyle(0x57493c, 1);
      for (let i = 0; i < 14; i++) g.fillCircle(Phaser.Math.Between(0, GAME_W), Phaser.Math.Between(480, 590), Phaser.Math.Between(6, 16));

      g.fillStyle(0x1c1917, 0.35).fillEllipse(300, 200, 470, 170);
      this.add.text(300, 196, "내가 제일 좋아하는 시간\n- 최재훈 다녀감", textStyle({
        fontSize: "34px", fontStyle: "bold", color: "#d6d3d1", align: "center", lineSpacing: 16,
      })).setOrigin(0.5).setAngle(-5).setAlpha(0.88);
      this.addHotspot({
        name: "숯 글씨", x: 300, y: 196, w: 450, h: 160, ignoreSelection: true,
        onTap: () => {
          GameState.flags.rocksNoteRead = true;
          say("재훈부장님이 자주 간다는 낚시 장소가 여기구나! 그럼 제일 좋아하는 시간은... 퇴근시간?!");
        },
      });

      this.cx = 845; this.cy = 268;
      const R = 168;
      g.lineStyle(6, 0x1c1917, 0.6).strokeCircle(this.cx, this.cy, R);
      g.fillStyle(0x0c0a09, 1).fillEllipse(this.cx, this.cy, 120, 104);

      this.pressed = new Set();
      this.stones = [];
      for (let n = 1; n <= 12; n++) {
        const a = Phaser.Math.DegToRad(n * 30);
        const x = this.cx + Math.sin(a) * R, y = this.cy - Math.cos(a) * R;
        const sg = this.add.graphics().setPosition(x, y);
        const label = this.add.text(x, y, String(n), textStyle({ fontSize: "28px", fontStyle: "bold", color: "#292524" })).setOrigin(0.5);
        const s = { n, x, y, g: sg, label };
        this.stones.push(s);
        this.drawStone(s);
        this.addHotspot({ name: `${n}번 돌`, x, y, w: 80, h: 80, flash: false, ignoreSelection: true, onTap: () => this.pressStone(s) });
      }

      if (!F.rocksSolved) {
        this.center = this.add.container(this.cx, this.cy);
        const cg = this.add.graphics();
        cg.fillStyle(C.outline, 1).fillCircle(0, 0, 68);
        cg.fillStyle(0x57534e, 1).fillCircle(0, 4, 62);
        cg.fillStyle(0x78716c, 1).fillCircle(0, 0, 60);
        cg.fillStyle(0xa8a29e, 1).fillEllipse(-18, -24, 40, 16);
        cg.lineStyle(2, 0x44403c, 0.7).lineBetween(-30, -20, -6, 4).lineBetween(-6, 4, 10, -12).lineBetween(16, 18, 34, 30);
        this.center.add(cg);
        this.centerHotspot = this.addHotspot({
          name: "가운데 돌", x: this.cx, y: this.cy, w: 120, h: 120, ignoreSelection: true,
          onTap: () => say("가운데 큰 돌이 살짝 흔들린다. 주변 숫자 돌들과 연결된 장치 같은데…"),
        });
      } else {
        this.showFish();
      }

      this.addLoot({ flag: "rocksBranch", item: "branch", x: 170, y: 430, angle: 8, w: 140, h: 80, msg: "돌 틈에 나뭇가지가 끼어 있었다." });
    }

    drawStone(s) {
      const on = this.pressed.has(s.n) || (GameState.flags.rocksSolved && (s.n === 5 || s.n === 6));
      s.g.clear();
      if (on) s.g.fillStyle(0xfbbf24, 0.3).fillCircle(0, 0, 48);
      s.g.fillStyle(C.outline, 1).fillCircle(0, 0, 38);
      s.g.fillStyle(on ? 0xc2410c : 0x78716c, 1).fillCircle(0, 3, 34);
      s.g.fillStyle(on ? 0xf59e0b : 0xa8a29e, 1).fillCircle(0, 0, 32);
      s.g.fillStyle(on ? 0xfde68a : 0xd6d3d1, 1).fillEllipse(-10, -14, 26, 10);
      s.label.setColor(on ? "#431407" : "#292524");
    }

    pressStone(s) {
      if (GameState.flags.rocksSolved) { say("이미 풀린 장치다."); return; }
      if (this.pressed.has(s.n)) this.pressed.delete(s.n);
      else this.pressed.add(s.n);
      this.drawStone(s);
      this.tweens.add({ targets: [s.g, s.label], scale: 0.88, duration: 80, yoyo: true });

      if (this.pressed.size < 2) return;
      if (this.pressed.has(5) && this.pressed.has(6)) { this.solve(); return; }

      GameState.busy = true;
      this.time.delayedCall(350, () => {
        this.tweens.add({ targets: this.center, x: this.cx + 8, duration: 50, yoyo: true, repeat: 3 });
        say(narr("덜컹… 아무 일도 일어나지 않았다."));
        this.pressed.clear();
        this.stones.forEach((st) => this.drawStone(st));
        GameState.busy = false;
      });
    }

    solve() {
      GameState.flags.rocksSolved = true;
      GameState.busy = true;
      this.stones.forEach((st) => this.drawStone(st));
      if (this.centerHotspot) this.centerHotspot.zone.destroy();
      this.time.delayedCall(300, () => {
        this.cameras.main.shake(300, 0.008);
        this.tweens.add({
          targets: this.center, y: this.cy + 24, scale: 0.15, alpha: 0, duration: 700, ease: "Quad.easeIn",
          onComplete: () => {
            this.destroyDeep(this.center);
            this.showFish();
            GameState.busy = false;
            say(narr("쿠웅…! 5시 30분, 가운데 돌이 아래로 쑥 꺼졌다!"), "구멍 안에서 뭔가 반짝이는데…?");
          },
        });
      });
    }

    showFish() {
      this.addLoot({
        flag: "fishTaken", item: "fish_metal", x: this.cx, y: this.cy, w: 130, h: 110, size: 84,
        msg: "물고기 모양 쇳덩어리다. 어딘가에 끼우는 열쇠 같은데?",
      });
    }
  }

       ["waterBranch2", 1044, 458, -12, "이끼 낀 돌 사이에 걸린 나뭇가지를 빼냈다."]].forEach(([flag, x, y, angle, msg]) => {

  /* =====================================================================
   *  10-⑤ 클로즈업: 물건더미 & 화로 (5단계 조리 FSM + 더미 5종)
   * ===================================================================== */
  const BRAZIER_FSM = [
    { need: "branch",    icon: "🪵" },
    { need: "magazine",  icon: "📖" },
    { need: "lighter",   icon: "🔥" },
    { need: "pot_water", icon: "💧" },
    { need: "ramen_raw", icon: "🍜" },
  ];
  const BRAZIER_DESC = [
    "텅 빈 화로다. 불을 피우려면 땔감이 넉넉히 필요하겠다.",
    "장작을 쌓았다. 불이 잘 붙게 할 불쏘시개가 필요하다.",
    "불쏘시개도 넣었다. 이제 불만 붙이면 된다.",
    "불이 활활 타오른다! 물 끓일 냄비를 올리자.",
    "물이 보글보글 끓고 있다. 라면을 넣을 차례!",
    "맛있는 냄새가 아직 남아 있다…",
  ];

  class JunkScene extends CloseupScene {
    constructor() { super("CLOSEUP_JUNK", "🔥 물건더미 & 화로"); }

    drawScene() {
      const g = this.add.graphics();
      g.fillGradientStyle(0xf4a261, 0xf4a261, 0xe9c46a, 0xe9c46a, 1).fillRect(0, 0, GAME_W, 300);
      g.fillStyle(0xe9c46a, 1).fillRect(0, 300, GAME_W, 300);
      g.fillStyle(0xd4a94f, 0.6).fillRect(0, 300, GAME_W, 8);
      g.fillStyle(0xc9a050, 0.5);
      for (let i = 0; i < 60; i++) g.fillCircle(Phaser.Math.Between(0, GAME_W), Phaser.Math.Between(310, VIEW_H), Phaser.Math.Between(1, 3));

      // 나무 상자 (외곽선 + 음영)
      g.fillStyle(0x000000, 0.15).fillEllipse(300, 440, 460, 40);
      const crate = (x, y, w, h, base, x2) => {
        g.fillStyle(C.outline, 1).fillRect(x - 4, y - 4, w + 8, h + 8);
        g.fillStyle(base, 1).fillRect(x, y, w, h);
        g.fillStyle(0x6b4423, 1).fillRect(x, y + h - 12, w, 12);
        g.fillStyle(0xd4a373, 1).fillRect(x + 4, y + 4, w - 8, 6);
        g.lineStyle(4, 0x6b4423).strokeRect(x + 10, y + 10, w - 20, h - 24);
        if (x2) g.lineBetween(x + 10, y + 10, x + w - 10, y + h - 14);
      };
      crate(100, 250, 210, 180, 0xa47148, true);
      crate(300, 320, 170, 110, 0xb5835a, false);
      crate(140, 180, 130, 70, 0x8b5e3c, false);

      this.addHotspot({
        name: "물건더미", x: 290, y: 330, w: 420, h: 180, flash: false,
        onTap: () => say("떠밀려 온 상자들이다. 잡동사니 중에서 쓸 만한 물건만 골라 챙기자."),
      });

      // ── 더미 오브젝트 (낚싯대 · 빈병 · 비닐봉지 · 조개껍데기 · 꽃게) ──
      const trash = "쓸모없는 쓰레기다.";
      this.addDummy({ tex: "obj_rod", x: 50, y: 300, size: 170, angle: -6, msg: trash });
      this.addDummy({ tex: "obj_bottle", x: 518, y: 398, size: 74, angle: -14, msg: trash });
      this.addDummy({ tex: "obj_plastic", x: 610, y: 340, size: 82, angle: 6, msg: trash });
      this.addDummy({ tex: "obj_shell", x: 664, y: 410, size: 56, angle: -10, msg: trash });
      this.createCrab();

      // ── 루팅: 빈 냄비, 수저세트, 나뭇가지 3개 ──
      this.addLoot({ flag: "junkPot", item: "pot_empty", x: 205, y: 140, w: 120, h: 100, size: 76, msg: "찌그러졌지만 쓸 만한 냄비다. 물을 담을 수 있겠어." });
      this.addLoot({ flag: "junkCutlery", item: "cutlery", x: 385, y: 278, w: 110, h: 90, size: 64, msg: "수저세트다. 뭔가 먹을 일이 생기면 좋겠는데." });
      [[120, 470, 6], [270, 482, -10], [420, 468, 14]].forEach(([x, y, a], i) =>
        this.addLoot({ flag: `junkBranch${i + 1}`, item: "branch", x, y, angle: a, w: 130, h: 70, msg: "상자 아래에 나뭇가지가 있었다." }));

      // 화로
      this.X = 880;
      this.addHotspot({
        name: "화로", x: this.X, y: 300, w: 380, h: 320,
        onTap: () => say(BRAZIER_DESC[GameState.flags.brazierStep || 0]),
        onUse: (itemId) => this.useOnBrazier(itemId),
      });
      this.renderBrazier();
    }

    /** 좌우로 오가는 꽃게 — 터치하면 후다닥 도망갔다가 돌아옴 */
    createCrab() {
      const crab = this.addDummy({
        tex: "obj_crab", x: 548, y: 466, size: 70,
        onTap: () => {
          if (crab.fleeing) return;
          crab.fleeing = true;
          this.patrol.pause();
          say("꽃게가 집게발을 흔들며 도망간다!");
          const home = { x: crab.x, y: crab.y };
          this.tweens.chain({
            targets: crab,
            tweens: [
              { angle: 12, duration: 60, yoyo: true, repeat: 2 },
              { x: home.x + 150, y: home.y - 10, duration: 260, ease: "Quad.easeOut" },
              { x: home.x, y: home.y, duration: 900, delay: 900, ease: "Sine.easeInOut" },
            ],
            onComplete: () => { crab.fleeing = false; crab.setAngle(0); this.patrol.resume(); },
          });
        },
      });
      crab.fleeing = false;
      this.patrol = this.tweens.add({
        targets: crab, x: 652, duration: 2000, yoyo: true, repeat: -1, ease: "Sine.easeInOut",
        onYoyo: () => crab.setFlipX(true), onRepeat: () => crab.setFlipX(false),
      });
      this.tweens.add({ targets: crab, scaleY: crab.scaleY * 0.92, duration: 160, yoyo: true, repeat: -1 });
    }

    useOnBrazier(itemId) {
      const F = GameState.flags;
      const step = F.brazierStep || 0;
      if (step >= 5) { say("라면은 이미 다 끓였다."); return true; }

      const expected = BRAZIER_FSM[step].need;
      if (itemId !== expected) { say("지금은 할 수 없다."); return true; }

      switch (step) {
        case 0: {
          const n = Inventory.count("branch");
          if (n < ITEMS.branch.max) { say(`나뭇가지가 아직 부족하다. (${n}/${ITEMS.branch.max})`); return true; }
          Inventory.remove("branch", ITEMS.branch.max);
          F.brazierStep = 1;
          say(narr("나뭇가지 10개를 화로에 차곡차곡 쌓았다."));
          break;
        }
        case 1:
          Inventory.remove("magazine");
          F.brazierStep = 2;
          say("월간 피싱 잡지를 찢어 불쏘시개로 넣었다. 재훈부장님 죄송해요…");
          break;
        case 2:
          F.brazierStep = 3;
          this.cameras.main.flash(300, 255, 180, 80);
          toast("🔥 불이 붙었다!");
          say(narr("화르륵! 잡지에 붙은 불이 장작으로 옮겨붙었다!"));
          break;
        case 3:
          Inventory.remove("pot_water");
          F.brazierStep = 4;
          say(narr("물 찬 냄비를 화로에 걸었다. 금세 보글보글 끓기 시작한다."));
          break;
        case 4:
          Inventory.remove("ramen_raw");
          Inventory.select(null);
          this.cookRamen();
          return true;
      }
      Inventory.select(null);
      this.renderBrazier();
      return true;
    }

    cookRamen() {
      GameState.busy = true;
      const bowl = this.add.image(this.X, 230, "icon_ramen_cooked").setDisplaySize(96, 96).setDepth(20).setScale(0.2).setAlpha(0);
      this.tweens.add({ targets: bowl, scale: 0.75, alpha: 1, y: 160, duration: 700, ease: "Back.easeOut" });
      say(narr("봉지를 뜯어 면과 스프를 넣었다. 보글보글… 면이 익어간다…"));
      this.time.delayedCall(1900, () => {
        this.tweens.add({ targets: bowl, alpha: 0, y: 130, duration: 300, onComplete: () => bowl.destroy() });
        GameState.flags.brazierStep = 5;
        this.renderBrazier();
        Inventory.add("ramen_cooked");
        toast("🍜 완성된 라면 획득!");
        say("김이 모락모락 나는 라면이 완성됐다! 냄새가 정말 기가 막히네... 쓰러져 계신 이영현 부장님께 가져가 볼까?");
        setQuest("📌 부장님께 라면 가져가기");
        GameState.busy = false;
      });
    }

    renderBrazier() {
      const st = GameState.flags.brazierStep || 0;
      const X = this.X;
      if (this.brz) this.destroyDeep(this.brz);
      (this.brzEvents || []).forEach((e) => e.remove());
      this.brzEvents = [];

      const Cn = (this.brz = this.add.container(0, 0).setDepth(2));
      const g = this.add.graphics();
      Cn.add(g);
      g.fillStyle(0x000000, 0.2).fillEllipse(X, 448, 380, 60);
      g.fillStyle(0x1c1917, 1).fillEllipse(X, 420, 270, 74);
      g.fillStyle(0x0c0a09, 1).fillCircle(X - 50, 422, 6).fillCircle(X + 30, 428, 5);

      if (st >= 1) {
        g.lineStyle(22, C.outline).lineBetween(X - 110, 424, X + 90, 398).lineBetween(X - 90, 398, X + 110, 424);
        g.lineStyle(16, 0x7a4a24).lineBetween(X - 110, 424, X + 90, 398).lineBetween(X - 90, 398, X + 110, 424);
        g.lineStyle(14, 0x8b5a2b).lineBetween(X - 70, 412, X + 70, 404);
        g.fillStyle(0xd4a373, 1).fillCircle(X - 110, 424, 7).fillCircle(X + 110, 424, 7).fillCircle(X + 90, 398, 7).fillCircle(X - 90, 398, 7);
      }
      if (st >= 2 && st < 4) {
        g.fillStyle(0xf1f5f9, 1).fillTriangle(X - 40, 402, X - 6, 374, X + 10, 404);
        g.fillStyle(0xbfdbfe, 1).fillTriangle(X, 400, X + 30, 372, X + 46, 402);
        g.fillStyle(0xfef3c7, 1).fillTriangle(X - 26, 404, X + 4, 384, X + 26, 406);
      }
      for (let i = 0; i < 16; i++) {
        const a = (i / 16) * Math.PI * 2;
        const x = X + Math.cos(a) * 142, y = 420 + Math.sin(a) * 40;
        g.fillStyle(C.outline, 1).fillCircle(x, y, 19);
        g.fillStyle(0x78716c, 1).fillCircle(x, y + 2, 16);
        g.fillStyle(0xa8a29e, 1).fillCircle(x, y, 15);
        g.fillStyle(0xd6d3d1, 1).fillCircle(x - 5, y - 5, 4);
      }
      g.lineStyle(12, C.outline).lineBetween(X - 150, 446, X, 150).lineBetween(X + 150, 446, X, 150);
      g.lineStyle(7, 0x8b5a2b).lineBetween(X - 150, 446, X, 150).lineBetween(X + 150, 446, X, 150);
      g.lineStyle(3, 0x374151).lineBetween(X, 150, X, 205);

      if (st >= 3) {
        [[-50, 0xf97316, 60, 100], [50, 0xf97316, 60, 96], [0, 0xf97316, 80, 130], [-20, 0xfbbf24, 44, 80], [24, 0xfbbf24, 40, 74], [0, 0xfff7ae, 24, 46]]
          .forEach(([dx, col, w, h], i) => {
            const f = this.add.ellipse(X + dx, 418, w, h, col, 0.95).setOrigin(0.5, 1);
            Cn.add(f);
            this.tweens.add({ targets: f, scaleY: { from: 0.85, to: 1.15 }, scaleX: { from: 1.05, to: 0.95 }, duration: 180 + i * 30, yoyo: true, repeat: -1 });
          });
        this.brzEvents.push(this.time.addEvent({
          delay: 260, loop: true, callback: () => {
            const e = this.add.circle(X + Phaser.Math.Between(-60, 60), 380, Phaser.Math.Between(2, 4), 0xffb347).setDepth(3);
            this.tweens.add({ targets: e, y: 250, x: e.x + Phaser.Math.Between(-30, 30), alpha: 0, duration: 1100, onComplete: () => e.destroy() });
          },
        }));
      }

      if (st >= 4) {
        const pot = this.add.image(X, 262, st === 4 ? "icon_pot_water" : "icon_pot_empty").setDisplaySize(170, 170);
        Cn.add(pot);
        this.brzEvents.push(this.time.addEvent({
          delay: 420, loop: true, callback: () => {
            const s = this.add.ellipse(X + Phaser.Math.Between(-50, 50), 214, 40, 26, 0xffffff, 0.4).setDepth(3);
            this.tweens.add({ targets: s, y: 120, scale: 1.8, alpha: 0, duration: 1500, onComplete: () => s.destroy() });
          },
        }));
        if (st === 4) {
          this.brzEvents.push(this.time.addEvent({
            delay: 200, loop: true, callback: () => {
              const b = this.add.circle(X + Phaser.Math.Between(-50, 50), 230, Phaser.Math.Between(3, 7)).setStrokeStyle(2, 0xffffff, 0.9).setDepth(3);
              this.tweens.add({ targets: b, y: 214, scale: 1.4, alpha: 0, duration: 450, onComplete: () => b.destroy() });
            },
          }));
          const bubbleTxt = this.add.text(X + 130, 196, "보글보글", textStyle({ fontSize: "20px", fontStyle: "bold", color: "#e0f2fe", stroke: "#0c4a6e", strokeThickness: 4 })).setOrigin(0.5);
          Cn.add(bubbleTxt);
          this.tweens.add({ targets: bubbleTxt, y: 181, alpha: 0.4, duration: 600, yoyo: true, repeat: -1 });
        }
      }

      const pg = this.add.graphics();
      drawWood(pg, X - 175, 92, 350, 40, 10);
      const prog = this.add.text(X, 110, BRAZIER_FSM.map((s, i) => (i < st ? s.icon : "❔")).join("  →  "),
        { fontFamily: EMOJI_FONT, fontSize: "20px", resolution: TEXT_RES, color: C.cream }).setOrigin(0.5);
      Cn.add([pg, prog]);
    }
  }

    { id: "cheek", name: "분홍 볼터치", hits: [[196, 246], [304, 246]], ring: { x: 250, y: 246, w: 196, h: 74 } },
