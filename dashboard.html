<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>살아남아 퇴근하기 · 실시간 리더보드</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b1220;
      --bg-grad: radial-gradient(1200px 600px at 10% -10%, #1b2a4a 0%, transparent 60%),
                 radial-gradient(900px 500px at 110% 10%, #10343a 0%, transparent 55%);
      --panel: #121b2e;
      --panel-2: #172238;
      --border: #24324d;
      --text: #e8eefc;
      --muted: #8a99b8;
      --accent: #ffb547;      /* 퇴근 노을 오렌지 */
      --success: #2fd28b;
      --success-bg: rgba(47, 210, 139, 0.14);
      --fail: #ff5c6c;
      --fail-bg: rgba(255, 92, 108, 0.14);
      --gold: #ffd54a;
      --silver: #cfd8e6;
      --bronze: #e39a5c;
      --mono: "JetBrains Mono", ui-monospace, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: "Noto Sans KR", system-ui, sans-serif;
      background: var(--bg-grad), var(--bg);
      color: var(--text);
      overflow: hidden;              /* 프로젝터용: 스크롤 없이 한 화면 */
    }

    .app {
      height: 100vh;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 1.6vh;
      padding: 2.4vh 2.4vw;
    }

    /* ── 헤더 ───────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .title { display: flex; align-items: center; gap: 1vw; }
    .title .logo {
      font-size: clamp(28px, 3.2vw, 56px);
      line-height: 1;
    }
    .title h1 {
      font-size: clamp(24px, 2.6vw, 46px);
      font-weight: 900;
      letter-spacing: -0.02em;
    }
    .title h1 span { color: var(--accent); }
    .title p { color: var(--muted); font-size: clamp(12px, 1vw, 18px); margin-top: 2px; }

    .status {
      display: flex; align-items: center; gap: 10px;
      font-size: clamp(12px, 0.95vw, 17px);
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 10px 16px; border-radius: 999px;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
    .status.live .dot { background: var(--success); box-shadow: 0 0 0 0 rgba(47,210,139,.6); animation: pulse 1.6s infinite; }
    .status.error .dot { background: var(--fail); }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(47,210,139,.55); }
      70%  { box-shadow: 0 0 0 10px rgba(47,210,139,0); }
      100% { box-shadow: 0 0 0 0 rgba(47,210,139,0); }
    }

    /* ── 통계 카드 ───────────────────── */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.4vw;
    }
    .card {
      background: linear-gradient(180deg, var(--panel-2), var(--panel));
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 2vh 1.6vw;
      position: relative;
      overflow: hidden;
    }
    .card .label { color: var(--muted); font-size: clamp(13px, 1.05vw, 20px); font-weight: 500; }
    .card .value {
      font-family: var(--mono);
      font-size: clamp(30px, 3.6vw, 68px);
      font-weight: 700;
      margin-top: 0.6vh;
      line-height: 1.1;
    }
    .card .sub { color: var(--muted); font-size: clamp(12px, 0.95vw, 17px); margin-top: 0.6vh; }
    .card .sub b { color: var(--text); }
    .card.accent .value { color: var(--accent); }
    .card.ok .value { color: var(--success); }
    .rate-bar {
      height: 6px; border-radius: 6px; background: var(--fail-bg);
      margin-top: 1vh; overflow: hidden;
    }
    .rate-bar > i { display: block; height: 100%; width: 0; background: var(--success); transition: width .6s ease; }

    /* ── 메인 2열 ───────────────────── */
    .main {
      display: grid;
      grid-template-columns: 1fr 1.25fr;
      gap: 1.4vw;
      min-height: 0;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      display: flex; flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    .panel-head {
      display: flex; align-items: baseline; justify-content: space-between;
      padding: 1.8vh 1.6vw 1.2vh;
      border-bottom: 1px solid var(--border);
    }
    .panel-head h2 { font-size: clamp(17px, 1.5vw, 28px); font-weight: 700; }
    .panel-head small { color: var(--muted); font-size: clamp(11px, 0.85vw, 15px); }
    .panel-body { flex: 1; min-height: 0; overflow: hidden; }

    /* 리더보드 */
    .rank-list { list-style: none; padding: 0.8vh 1vw; height: 100%; display: flex; flex-direction: column; }
    .rank-item {
      flex: 1;
      display: grid;
      grid-template-columns: 3.2vw 1fr auto;
      align-items: center;
      gap: 1vw;
      padding: 0 0.8vw;
      border-radius: 12px;
      max-height: 8vh;
      font-size: clamp(15px, 1.35vw, 26px);
    }
    .rank-item:nth-child(odd) { background: rgba(255,255,255,0.02); }
    .rank-no {
      font-family: var(--mono); font-weight: 700; text-align: center; color: var(--muted);
    }
    .rank-item.r1 .rank-no { color: var(--gold); font-size: 1.25em; }
    .rank-item.r2 .rank-no { color: var(--silver); font-size: 1.15em; }
    .rank-item.r3 .rank-no { color: var(--bronze); font-size: 1.1em; }
    .rank-item.r1 { background: linear-gradient(90deg, rgba(255,213,74,.14), transparent 70%); }
    .rank-name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rank-name .suffix { color: var(--muted); font-weight: 400; font-size: .8em; margin-left: 4px; }
    .rank-time { font-family: var(--mono); font-weight: 700; color: var(--accent); }
    .rank-item.empty { color: var(--border); }
    .rank-item.empty .rank-time { color: var(--border); }

    /* 로그 테이블 */
    table { width: 100%; border-collapse: collapse; font-size: clamp(13px, 1.1vw, 21px); }
    thead th {
      position: sticky; top: 0;
      background: var(--panel);
      color: var(--muted); font-weight: 500; text-align: left;
      padding: 1.2vh 1.2vw;
      font-size: .85em;
    }
    tbody td { padding: 1.15vh 1.2vw; border-top: 1px solid rgba(36,50,77,.6); }
    td.name { font-weight: 700; max-width: 14vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    td.time, td.date { font-family: var(--mono); }
    td.date { color: var(--muted); }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 12px; border-radius: 999px;
      font-size: .85em; font-weight: 700; white-space: nowrap;
    }
    .badge.success { color: var(--success); background: var(--success-bg); }
    .badge.fail { color: var(--fail); background: var(--fail-bg); }
    tr.fresh { animation: flash 2.4s ease-out; }
    @keyframes flash {
      0%   { background: rgba(255,181,71,.28); }
      100% { background: transparent; }
    }
    .empty-msg {
      height: 100%; display: grid; place-items: center;
      color: var(--muted); font-size: clamp(14px, 1.2vw, 22px); text-align: center; line-height: 1.7;
    }

    /* 신규 성공 토스트 */
    .toast {
      position: fixed; left: 50%; bottom: 4vh; transform: translate(-50%, 140%);
      background: var(--accent); color: #1a1205;
      padding: 1.6vh 2.4vw; border-radius: 16px;
      font-size: clamp(16px, 1.6vw, 30px); font-weight: 900;
      box-shadow: 0 12px 40px rgba(0,0,0,.45);
      transition: transform .5s cubic-bezier(.2,.9,.3,1.3);
      z-index: 10;
    }
    .toast.show { transform: translate(-50%, 0); }

    /* 세로가 긴 화면(노트북 미리보기 등) 대응 */
    @media (max-width: 900px) {
      body { overflow: auto; }
      .app { height: auto; }
      .stats, .main { grid-template-columns: 1fr; }
      .rank-item { max-height: none; padding: 1.2vh 2vw; grid-template-columns: 40px 1fr auto; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title">
        <div class="logo">🏝️</div>
        <div>
          <h1>살아남아 <span>퇴근하기</span></h1>
          <p>실시간 리더보드 · 무인도 탈출 현황</p>
        </div>
      </div>
      <div class="status" id="status">
        <span class="dot"></span>
        <span id="statusText">연결 중…</span>
      </div>
    </header>

    <section class="stats">
      <div class="card">
        <div class="label">총 도전자</div>
        <div class="value" id="statTotal">0</div>
        <div class="sub">성공 <b id="statSuccess">0</b> · 실패 <b id="statFailed">0</b></div>
      </div>
      <div class="card ok">
        <div class="label">퇴근 성공률</div>
        <div class="value" id="statRate">0%</div>
        <div class="rate-bar"><i id="rateBar"></i></div>
      </div>
      <div class="card accent">
        <div class="label">최단 퇴근 기록 🏆</div>
        <div class="value" id="statBest">--:--</div>
        <div class="sub" id="statBestName">아직 탈출한 사원이 없습니다</div>
      </div>
    </section>

    <section class="main">
      <div class="panel">
        <div class="panel-head">
          <h2>🏆 명예의 전당 TOP 10</h2>
          <small>퇴근 성공 · 빠른 순</small>
        </div>
        <div class="panel-body">
          <ol class="rank-list" id="rankList"></ol>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>📡 실시간 플레이 로그</h2>
          <small id="logCount">최신순</small>
        </div>
        <div class="panel-body" id="logBody">
          <table>
            <thead>
              <tr>
                <th>이름</th>
                <th>결과</th>
                <th>소요 시간</th>
                <th>플레이 일시</th>
              </tr>
            </thead>
            <tbody id="logRows"></tbody>
          </table>
        </div>
      </div>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    /* ───────── 설정 ─────────
       기본: 대시보드를 server.py가 서빙하면 같은 주소의 API 사용.
       다른 곳에서 열 경우: dashboard.html?api=http://192.168.0.10:8000  */
    const params = new URLSearchParams(location.search);
    const API_BASE = (params.get("api") || (location.protocol.startsWith("http") ? location.origin : "http://localhost:8000")).replace(/\/$/, "");
    const POLL_MS = 5000;
    const LOG_LIMIT = 30;

    const $ = (id) => document.getElementById(id);
    let knownIds = null;          // 첫 로딩 이후 새로 들어온 기록 감지용
    let pollTimer = null;

    /* ───────── 유틸 ───────── */
    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }

    function fmtDuration(sec) {
      if (sec === null || sec === undefined) return "--:--";
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }

    function fmtDate(iso) {
      const d = new Date(iso);
      if (isNaN(d)) return "-";
      const p = (n) => String(n).padStart(2, "0");
      return `${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
    }

    function setStatus(state, text) {
      const el = $("status");
      el.classList.remove("live", "error");
      if (state) el.classList.add(state);
      $("statusText").textContent = text;
    }

    let toastTimer = null;
    function showToast(msg) {
      const t = $("toast");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove("show"), 4000);
    }

    /* ───────── 렌더링 ───────── */
    function renderStats(stats) {
      $("statTotal").textContent = stats.total_players.toLocaleString();
      $("statSuccess").textContent = stats.success_count;
      $("statFailed").textContent = stats.failed_count;
      $("statRate").textContent = `${stats.success_rate}%`;
      $("rateBar").style.width = `${stats.success_rate}%`;
      $("statBest").textContent = fmtDuration(stats.best_time_sec);
      $("statBestName").innerHTML = stats.best_player
        ? `<b>${escapeHtml(stats.best_player)}</b> 사원`
        : "아직 탈출한 사원이 없습니다";
    }

    function renderLeaderboard(list) {
      const medals = { 1: "🥇", 2: "🥈", 3: "🥉" };
      const rows = [];
      for (let i = 0; i < 10; i++) {
        const r = list[i];
        if (r) {
          rows.push(`
            <li class="rank-item r${r.rank}">
              <span class="rank-no">${medals[r.rank] || r.rank}</span>
              <span class="rank-name">${escapeHtml(r.player_name)}<span class="suffix">사원</span></span>
              <span class="rank-time">${fmtDuration(r.play_time_sec)}</span>
            </li>`);
        } else {
          rows.push(`
            <li class="rank-item empty">
              <span class="rank-no">${i + 1}</span>
              <span class="rank-name">—</span>
              <span class="rank-time">--:--</span>
            </li>`);
        }
      }
      $("rankList").innerHTML = rows.join("");
    }

    function renderLogs(logs) {
      $("logCount").textContent = `최신 ${logs.length}건`;
      if (!logs.length) {
        $("logBody").querySelector("tbody").innerHTML =
          `<tr><td colspan="4"><div class="empty-msg">아직 출근한 사원이 없습니다.<br/>스마트폰으로 게임에 접속해 보세요!</div></td></tr>`;
        return;
      }
      const isFirstLoad = knownIds === null;
      const html = logs.map((r) => {
        const fresh = !isFirstLoad && !knownIds.has(r.id);
        const badge = r.result_type === "SUCCESS"
          ? `<span class="badge success">✅ 퇴근 성공</span>`
          : `<span class="badge fail">💀 퇴근 실패</span>`;
        return `
          <tr class="${fresh ? "fresh" : ""}">
            <td class="name">${escapeHtml(r.player_name)}</td>
            <td>${badge}</td>
            <td class="time">${fmtDuration(r.play_time_sec)}</td>
            <td class="date">${fmtDate(r.created_at)}</td>
          </tr>`;
      }).join("");
      $("logRows").innerHTML = html;
    }

    function announceNew(data) {
      if (knownIds === null) return;
      const newbies = data.logs.filter((r) => !knownIds.has(r.id));
      // 가장 최근 신규 기록 하나만 토스트로 알림
      const latest = newbies[0];
      if (!latest) return;
      if (latest.result_type === "SUCCESS") {
        const entry = data.leaderboard.find((r) => r.id === latest.id);
        const rankText = entry ? ` · 현재 ${entry.rank}위!` : "";
        showToast(`🎉 ${latest.player_name} 사원 퇴근 성공! (${fmtDuration(latest.play_time_sec)})${rankText}`);
      } else {
        showToast(`🍜 ${latest.player_name} 사원… 라면을 혼자 먹고 퇴근 실패`);
      }
    }

    /* ───────── 데이터 동기화 ───────── */
    async function fetchRecords() {
      const ctrl = new AbortController();
      const timeout = setTimeout(() => ctrl.abort(), 4000);
      try {
        const res = await fetch(`${API_BASE}/api/game/records?log_limit=${LOG_LIMIT}&top=10`, {
          cache: "no-store",
          signal: ctrl.signal,
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        renderStats(data.stats);
        renderLeaderboard(data.leaderboard);
        announceNew(data);
        renderLogs(data.logs);
        knownIds = new Set(data.logs.map((r) => r.id));

        const t = new Date();
        setStatus("live", `LIVE · ${String(t.getHours()).padStart(2, "0")}:${String(t.getMinutes()).padStart(2, "0")}:${String(t.getSeconds()).padStart(2, "0")} 갱신`);
      } catch (err) {
        console.error("[dashboard] fetch 실패:", err);
        setStatus("error", "서버 연결 끊김 · 재시도 중");
      } finally {
        clearTimeout(timeout);
      }
    }

    function startPolling() {
      stopPolling();
      fetchRecords();
      pollTimer = setInterval(fetchRecords, POLL_MS);
    }
    function stopPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = null;
    }

    // 탭이 다시 보이면 즉시 갱신 (프로젝터 PC 절전 복귀 대비)
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) startPolling();
    });

    renderLeaderboard([]);
    startPolling();
  </script>
</body>
</html>
